name: PR build comment

# Report a failed PR build without giving the build job write access. This
# workflow runs from the base branch, checks out nothing and only comments.
# It also works for pull requests from forks, whose build token is read-only.

on:
  workflow_run:
    workflows: ["PR build"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Report the build result
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create, update or remove the build comment
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const pullRequest = (run.pull_requests || [])[0];
            if (!pullRequest) {
              core.info('This run has no pull request; nothing to report.');
              return;
            }

            const marker = '<!-- snap-repo-build -->';
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (run.conclusion === 'success') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                core.info('Build passes; removed the old failure comment.');
              }
              return;
            }

            if (run.conclusion !== 'failure') {
              core.info(`Build concluded with ${run.conclusion}; leaving any comment alone.`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const failed = jobs.filter((job) => job.conclusion === 'failure').map((job) => job.name);

            const lines = [
              marker,
              '## Snap build failed',
              '',
              failed.length
                ? `Failed job${failed.length === 1 ? '' : 's'}:\n${failed.map((name) => `- \`${name}\``).join('\n')}`
                : 'The workflow failed before any package job ran.',
              '',
              `[View the run](${run.html_url})`,
            ];
            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info('Updated the existing build failure comment.');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pullRequest.number, body });
              core.info('Posted a build failure comment.');
            }
