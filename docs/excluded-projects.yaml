# Upstream projects that develop their own source code and keep their snap
# recipe in the same repository. Their recipe belongs with the source, so they
# are excluded from this monorepo's package tree and from ./snap-repo build.
#
# They are listed here so there is still one inventory of every desktop snap:
# what the project is, where it lives, which branch carries the core26 work,
# and where the local working copy is. Bulk changes can target these entries
# the same way they target the packaging-only packages in this repository.
#
# This file is documentation: no tool reads it, and these projects are not
# built by ./snap-repo build.
#
# Not listed here:
#   - snaps that only repackage another upstream: those are the packages in
#     the recipes/ tree (see ../README.md)
#   - firefox: also a repackage, excluded because Mozilla publishes it
#
# local-commit records the working copy at the time of writing; the
# merge-request is the authoritative pending change once it lands.

excluded-projects:
  - project: app-center
    snap: snap-store
    repo: https://github.com/ubuntu/app-center
    branch: main
    local: /home/chrb/git/snaps-core26-update/github/app-center
    local-branch: core26-update
    local-commit: d85d71ef3e9e5825ca7c0b56370df5256acc453b
    recipe: snap/snapcraft.yaml
    merge-request: https://github.com/ubuntu/app-center/pull/2280

  - project: authd
    snap: authd-google
    repo: https://github.com/canonical/authd
    branch: main
    local: /home/chrb/git/snaps-core26-update/github/authd
    local-branch: core26-update
    local-commit: 4b9d4a87c5641247c4f78c6a05651f655cfd108b
    recipe: snap/variants/google/snapcraft.yaml
    prepare: snap/scripts/prepare-variant --broker google --copy
    merge-request: https://github.com/canonical/authd/pull/2188

