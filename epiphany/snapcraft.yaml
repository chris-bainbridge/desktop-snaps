name: epiphany
adopt-info: epiphany
summary: Web browser for GNOME
description: |
  The web browser for GNOME, featuring tight integration with the desktop
  and a simple and intuitive user interface that allows you to focus on your
  web pages. If you’re looking for a simple, clean, beautiful view of the
  web, this is the browser for you.

  GNOME Web is often referred to by its code name, Epiphany.

grade: stable
confinement: strict
base: core26
contact: https://gitlab.gnome.org/GNOME/epiphany/-/issues

platforms:
  amd64:
  arm64:

# Launchpad doesn't recognize these fields yet
passthrough:
  title: GNOME Web

slots:
  # for GtkApplication registration
  epiphany:
    interface: dbus
    bus: session
    name: org.gnome.Epiphany

layout:
  /usr/share/epiphany:
    bind: $SNAP/usr/share/epiphany
  # Epiphany compiles the web-process extension directory as
  # /usr/lib/<triplet>/epiphany/web-process-extensions. In a snap /usr comes
  # from the base, so bind the staged directory there to let WebKitWebProcess
  # load the extension (password autofill and secure password generation).
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/epiphany/web-process-extensions:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/epiphany/web-process-extensions
  # WebKitGTK 6.0 comes from the gnome-core26 content snap: the gnome
  # extension maps /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkitgtk-6.0
  # (WebKitWebProcess, the injected bundle and friends) to it, and carries
  # libwebkitgtk-6.0.so.4. Staging the archive copy would duplicate it.

apps:
  epiphany:
    command: bin/snapcraft-preload $SNAP/usr/bin/epiphany
    extensions: [ gnome ]
    plugs:
      - audio-playback
      - audio-record
      - browser-support
      - camera
      - cups
      - hardware-observe
      - home
      - hostname-control
      - mount-observe
      - network
      - network-status
      - opengl
      - password-manager-service
      - removable-media
      - screen-inhibit-control
      - upower-observe
    desktop: usr/share/applications/org.gnome.Epiphany.desktop
    environment:
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      GIO_MODULE_DIR: $SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules/
      LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/epiphany:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack

parts:
  snapbuildtools:
# ext:updatesnap
#   version-format:
#     allow-neither-tag-nor-branch: true
    source: https://github.com/sergio-costas/snap-build-tools.git
    source-depth: 1
    plugin: nil
    build-snaps: [core26, gtk-common-themes, gnome-core26]
    override-build: |
      craftctl default
      # Keep the helper in the part install so the next part can use it from
      # the stage directory (a project-root copy does not survive rebuilding
      # with cached part state).
      mkdir -p "$CRAFT_PART_INSTALL/snapbuildtools"
      cp "$CRAFT_PART_SRC/remove_common/remove_common.py" \
         "$CRAFT_PART_INSTALL/snapbuildtools/"

  packages:
    after: [snapbuildtools]
    source: .
    plugin: nil
    override-build: |
      craftctl default
      /usr/bin/python3 $CRAFT_STAGE/snapbuildtools/remove_common.py
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    build-packages:
      - python3-yaml
    stage-packages:
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      # gnome-core26 ships gcr-3 but not gcr-4 (epiphany 51 uses gcr-4) and
      # does not ship libxml2, which epiphany itself and the WebKitGTK copy
      # in the content snap link. libpwquality is already in the core26 base.
      - libgcr-4-4
      - libxml2-16
    stage:
      - -usr/bin/[a-df-z]*
      - -usr/include
      - -usr/lib/*/gtk-3.0/3.0.0/printbackends/libprintbackend*.so*
      - -usr/lib/*/libfribidi.so.0
      - -usr/lib/*/libatk-1.0.so.0
      - -usr/lib/*/libatk-bridge-2.0.so.0
      - -usr/lib/*/libatspi.so.0
      - -usr/lib/*/libgio-2.0.so*
      - -usr/lib/*/libglib-2.0.so*
      - -usr/lib/*/libgmodule-2.0.so*
      - -usr/lib/*/libgobject-2.0.so*
      - -usr/lib/*/libgthread-2.0.so*
      - -usr/lib/*/libgtk*
      - -usr/lib/*/libjson-glib-1.0.so*
      - -usr/lib/*/libpango*.so*
      - -usr/lib/*/libharfbuzz*.so*
      - -usr/lib/*/libsecret-1.so.*
      - -usr/lib/*/libLLVM.so*
      - -usr/sbin
      - -usr/share/glib-2.0/schemas/org.gtk*
      - -usr/share/gtk-4.0
      - -usr/share/icons

# epiphany needs access to /dev/shm/
  snapcraft-preload:
    after: [ packages ]
    source: https://github.com/sergiusens/snapcraft-preload.git
    source-depth: 1
# ext:updatesnap
#   version-format:
#     allow-neither-tag-nor-branch: true
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=
      # snapcraft-preload still declares cmake_minimum_required(3.2); CMake 4
      # (26.04) refuses policies older than 3.5 unless told otherwise.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-packages:
      - on amd64:
          - gcc-multilib
          - g++-multilib

  epiphany:
    after: [snapcraft-preload]
    source: https://gitlab.gnome.org/GNOME/epiphany.git
    source-type: git
    source-tag: '51.2'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: '51.99'
#     no-9x-revisions: true
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.Epiphany.metainfo.xml]
    meson-parameters:
      - --prefix=/usr

    override-pull: |
      craftctl default
      sed -i "s|r.stdout().strip()|'Snap Store'|g" $CRAFT_PART_SRC/meson.build

    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/apps/org.gnome.Epiphany.svg $CRAFT_PART_INSTALL/meta/gui/

    build-packages:
      - libarchive-dev
      - libgck-2-dev
      - libgcr-4-dev
      - libpwquality-dev
      # libgstreamer1.0-dev, libwebkitgtk-6.0-dev and libxml2-dev come
      # from the gnome-core26-sdk content of the gnome extension.

  cleanup:
    after: [epiphany]
    plugin: nil
    override-prime: |
      set -eux
      cd $CRAFT_PRIME/usr/share/glib-2.0/schemas
      glib-compile-schemas .
