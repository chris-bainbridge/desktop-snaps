name: evince
adopt-info: evince
summary: Document viewer for popular document formats
description: |
  This is a document viewer for the GNOME desktop.
  It supports the following document formats: PDF, PS, EPS, XPS, DjVu, TIFF, DVI (with SyncTeX), and Comic Books archives (CBR, CBT, CBZ, CB7).

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

slots:
  # for GtkApplication registration
  evince:
    interface: dbus
    bus: session
    name: org.gnome.Evince

apps:
  evince:
    command: usr/bin/evince
    extensions: [gnome]
    plugs:
      - gsettings
      - avahi-observe
      - cups
      - home
      - network
      - removable-media
    desktop: usr/share/applications/org.gnome.Evince.desktop

  evince-previewer:
    command: usr/bin/evince-previewer
    plugs:
      - avahi-observe
      - cups
      - gsettings
      - home
      - network
    desktop: usr/share/applications/org.gnome.Evince-previewer.desktop

  evince-thumbnailer:
    command: usr/bin/evince-thumbnailer
    plugs:
      - gsettings
      - home

parts:
  evince:
    source: https://gitlab.gnome.org/GNOME/evince.git
    source-type: git
    source-tag: '48.5'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: '49'
#     no-9x-revisions: true
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.Evince.metainfo.xml]
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
    meson-parameters:
      - --prefix=/snap/evince/current/usr
      - --buildtype=release
      - -Dnautilus=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Ddevelopment=false
    organize:
      snap/evince/current/usr: usr
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    build-packages:
      - appstream
      - libarchive-dev
      - libgail-3-dev
      - libgspell-1-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libsecret-1-dev
      - libsm-dev
      - zlib1g-dev
      - libspectre-dev
      - libtiff-dev
      - libdjvulibre-dev
      - libkpathsea-dev
      - libgxps-dev
      - gsettings-desktop-schemas-dev
      - dh-apparmor
    prime:
      - "-usr/lib/*.a"
      - "-usr/lib/mozilla"
      - "-usr/lib/pkgconfig"
      - "-usr/lib/systemd"
      - "-usr/lib/evince/4/backends/*.a"
      - "-usr/share/appdata"

  libraries:
    plugin: nil
    stage-packages:
      - libarchive13
      - libnss3
      - libnspr4
      # libevdocument3 links libxml2. It is in the gnome-core26-sdk build
      # snap but not in the gnome-core26 content snap, so stage a runtime
      # copy (see override-build for why it cannot stay in the multiarch dir).
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. Keep libxml2 in usr/lib, which
      # is not an SDK path and is on the extension's LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - "usr/lib/*/libarchive.so.*"
      - "usr/lib/*/libnss3.so"
      - "usr/lib/*/libnssutil3.so"
      - "usr/lib/*/libsmime3.so"
      - "usr/lib/*/libnspr4.so"
      - "usr/lib/*/libplc4.so"
      - "usr/lib/*/libplds4.so"
      - "usr/lib/libxml2.so.*"
