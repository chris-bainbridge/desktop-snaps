name: gnome-klotski
adopt-info: gnome-klotski
grade: stable
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

# gnome-klotski 3.38.2 (2020-11-22) is the latest stable upstream release; the
# project is no longer part of the GNOME release sets and only receives
# translation updates on master. It is a GTK3 + Vala application, which the
# gnome extension still supports on core26 (the content snap ships GTK3,
# libgee and librsvg).
#
# gnome-core26 ships libgnome-games-support-2 (GTK4) but not the GTK3
# libgnome-games-support-1 that this release links, so the 1.x library is
# staged from the 26.04 archive below.
#
# The content snap's librsvg (needed for the puzzle pieces) is built against
# libxml2, which gnome-core26 does not ship; the libraries part bundles the
# archive's libxml2-16.

slots:
  # for GtkApplication registration
  gnome-klotski:
    interface: dbus
    bus: session
    name: org.gnome.Klotski

apps:
  gnome-klotski:
    extensions: [gnome]
    command: usr/bin/gnome-klotski
    common-id: org.gnome.Klotski.desktop
    desktop: usr/share/applications/org.gnome.Klotski.desktop
    plugs:
      - gsettings

parts:
  gnome-klotski:
    source: https://gitlab.gnome.org/GNOME/gnome-klotski.git
    source-type: git
    source-tag: '3.38.2'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: '3.39'
#     no-9x-revisions: true
    plugin: meson
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # The help media symlinks would dangle in the snap.
      sed -i.bak -e 's|symlink_media: true|symlink_media: false|' $CRAFT_PART_SRC/help/meson.build
    override-build: |
      craftctl default
      # gtk-common-themes does not carry the application icon, so ship the
      # upstream icon in meta/gui and point the desktop file at it.
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/org.gnome.Klotski.svg \
         $CRAFT_PART_INSTALL/meta/gui/
      sed -i.bak -e 's|^Icon=org.gnome.Klotski$|Icon=${SNAP}/meta/gui/org.gnome.Klotski.svg|' \
         $CRAFT_PART_INSTALL/usr/share/applications/org.gnome.Klotski.desktop
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    parse-info: [usr/share/metainfo/org.gnome.Klotski.appdata.xml]
    build-packages:
      - appstream-util
      - yelp-tools
      - libgnome-games-support-1-dev
    stage-packages:
      - libgnome-games-support-1-3

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26's librsvg links libxml2 directly, but the content snap
      # does not ship libxml2.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome/cleanup part deletes every primed library whose path also
      # exists in the gnome-core26 SDK. libxml2 is in the SDK but not in the
      # content snap, so move it out of the SDK's multiarch path; $SNAP/usr/lib
      # is on the default LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*
