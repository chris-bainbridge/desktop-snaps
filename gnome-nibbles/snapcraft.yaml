name: gnome-nibbles
adopt-info: gnome-nibbles
title: GNOME Nibbles
license: GPL-3.0-or-later
contact: https://gitlab.gnome.org/GNOME/gnome-nibbles/-/issues
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

layout:
  # Levels and sounds are loaded from the absolute path the game was built
  # with (PKGDATADIR/SOUND_DIRECTORY), which is not inside the snap.
  /usr/share/gnome-nibbles:
    bind: $SNAP/usr/share/gnome-nibbles

slots:
  # for GtkApplication registration
  gnome-nibbles:
    interface: dbus
    bus: session
    name: org.gnome.Nibbles

apps:
  gnome-nibbles:
    extensions: [gnome]
    command: usr/bin/gnome-nibbles
    environment:
      # The glibmm/giomm libraries bundled by the part below live in
      # $SNAP/lib, which the gnome extension does not put on the path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/lib
    plugs:
      - audio-playback
    desktop: usr/share/applications/org.gnome.Nibbles.desktop
    common-id: org.gnome.Nibbles.desktop

# 4.6.x is a C++ (gtkmm-4.0) rewrite of the old Vala/Clutter code. The
# gnome-core26 content snap ships libgtkmm-4.0 and libgsound at runtime and
# gnome-core26-sdk provides the gtkmm 4.24 development files the rewrite
# requires. The two libraries the content snap does not ship are handled by
# the glibmm part below.
parts:
  gnome-nibbles:
    source: https://gitlab.gnome.org/GNOME/gnome-nibbles.git
    source-type: git
    source-tag: '4.6.2'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    parse-info: [usr/share/metainfo/org.gnome.Nibbles.metainfo.xml]
    build-packages:
      # gnome.yelp needs yelp-build; gnome-core26-sdk only ships itstool
      - yelp-tools
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    override-build: |
      # Use the bundled icon rather than the themed icon
      sed -i.bak -e 's|Icon=org.gnome.Nibbles$|Icon=${SNAP}/meta/gui/org.gnome.Nibbles.svg|g' $CRAFT_PART_SRC/data/org.gnome.Nibbles.desktop.in
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/org.gnome.Nibbles.svg $CRAFT_PART_INSTALL/meta/gui/
      craftctl default
      # meson's gnome.post_install() is skipped when DESTDIR is set, which is
      # how snapcraft installs. Compile the schema here so GSettings can
      # resolve org.gnome.Nibbles on first run.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
    prime:
      - usr/bin/gnome-nibbles
      - usr/share/applications/org.gnome.Nibbles.desktop
      - usr/share/dbus-1/services/org.gnome.Nibbles.service
      - usr/share/glib-2.0/schemas
      - usr/share/gnome-nibbles
      - usr/share/icons/hicolor
      - usr/share/locale
      - usr/share/metainfo/org.gnome.Nibbles.metainfo.xml
      - meta/gui

  # gnome-core26 ships libgtkmm-4.0 and libgsound, but not the glibmm/giomm
  # libraries gtkmm 4.24 links against. gtkmm 4.24 needs glibmm >= 2.89,
  # which is newer than the 2.86 version in the 26.04 archive, so take the
  # matching 2.90 libraries from the SDK snap that built gtkmm. They go to
  # $SNAP/lib because the gnome extension's cleanup part removes every
  # primed library whose path also exists in gnome-core26-sdk, and the SDK
  # ships glibmm in usr/lib; the app adds $SNAP/lib to LD_LIBRARY_PATH.
  glibmm:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/lib
      # glibmm is an autotools build in the SDK, so it installs to usr/lib
      # directly rather than the multiarch directory.
      cp -a /snap/gnome-core26-sdk/current/usr/lib/libglibmm-2.68.so.1* \
            /snap/gnome-core26-sdk/current/usr/lib/libgiomm-2.68.so.1* \
            $CRAFT_PART_INSTALL/lib/
    prime:
      - lib/libglibmm-2.68.so.*
      - lib/libgiomm-2.68.so.*
