name: gnome-robots
adopt-info: gnome-robots
title: Robots
license: GPL-3.0+
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  gnome-robots:
    interface: dbus
    bus: session
    name: org.gnome.Robots

apps:
  gnome-robots:
    extensions: [gnome]
    command: usr/bin/gnome-robots
    plugs:
      - audio-playback
      - gsettings
    desktop: usr/share/applications/org.gnome.Robots.desktop
    common-id: org.gnome.Robots.desktop

# Robots 50.0 is a Rust + GTK4/libadwaita rewrite of the old Vala/Clutter
# game. Its Meson build drives cargo itself on the upstream Cargo.lock.
# cargo and rustc are not part of gnome-core26-sdk; the 26.04 archive has
# rustc/cargo 1.93.1, which satisfies the upstream rust-version 1.92. GTK
# 4.24, libadwaita, glycin 2 and GStreamer (for the GtkMediaFile sound
# effects) come from the gnome-core26 SDK/content snaps.
#
# The prefix is the runtime mount path, not /usr: DATA_DIRECTORY,
# SOUND_DIRECTORY and LOCALEDIR are compiled into the binary, and a /usr
# prefix would resolve them to the core26 base instead of the snap. organize
# moves the installed tree back under usr/.
parts:
  gnome-robots:
# ext:updatesnap
    source: https://gitlab.gnome.org/GNOME/gnome-robots.git
    source-type: git
    source-tag: '50.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/snap/gnome-robots/current/usr
      - --buildtype=release
      - -Dprofile=release
    organize:
      snap/gnome-robots/current/usr: usr
    parse-info: [usr/share/metainfo/org.gnome.Robots.metainfo.xml]
    build-packages:
      - cargo
      - rustc
      # gnome.yelp needs yelp-build; gnome-core26-sdk only ships itstool
      - yelp-tools
    override-pull: |
      craftctl default
      # The upstream metainfo's <releases> list stops at 41.2, so adopt-info
      # cannot derive the version from it.
      craftctl set version=$(git describe --tags --abbrev=10)
      # Help media symlinks would dangle inside the snap.
      sed -i.bak -e 's|symlink_media: true|symlink_media: false|g' $CRAFT_PART_SRC/help/meson.build
    override-build: |
      sed -i.bak -e 's|^Icon=org.gnome.Robots$|Icon=${SNAP}/meta/gui/org.gnome.Robots.svg|g' $CRAFT_PART_SRC/data/org.gnome.Robots.desktop.in
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/org.gnome.Robots.svg $CRAFT_PART_INSTALL/meta/gui/
      # meson's gnome.post_install() is skipped when DESTDIR is set, which is
      # how snapcraft installs. Compile the schema here so GSettings can
      # resolve org.gnome.Robots on first run.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/snap/gnome-robots/current/usr/share/glib-2.0/schemas"
      # D-Bus activation is provided by the dbus slot above (snapd writes a
      # service file that runs "snap run"). Upstream's service file has a
      # build-time absolute Exec that the host bus would not use.
      rm -f "$CRAFT_PART_INSTALL/snap/gnome-robots/current/usr/share/dbus-1/services/org.gnome.Robots.service"
