name: gnome-sudoku
adopt-info: gnome-sudoku
summary: Test your logic skills in this number grid puzzle
description: |
  Play the popular Japanese logic game. GNOME Sudoku is a must-install for
  Sudoku lovers, with a simple, unobtrusive interface that makes playing
  Sudoku fun for players of any skill level.

  Each game is assigned a difficulty similar to those given by newspapers
  and websites, so your game will be as easy or as difficult as you want it
  to be.

  If you like to play on paper, you can print games out. You can choose how
  many games you want to print per page and what difficulty of games you
  want to print: as a result, GNOME Sudoku can act a renewable Sudoku book
  for you.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  gnome-sudoku:
    interface: dbus
    bus: session
    name: org.gnome.Sudoku

apps:
  gnome-sudoku:
    extensions: [gnome]
    command: usr/bin/gnome-sudoku
    desktop: usr/share/applications/org.gnome.Sudoku.desktop
    common-id: org.gnome.Sudoku.desktop
    environment:
      # gnome-core26 ships librsvg (GTK's SVG icon loader) and GTK 4, and
      # librsvg links libxml2.so.16, which the content snap does not ship.
      # The libraries part below bundles it in usr/lib. The gnome extension
      # only puts the platform on the library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - gsettings

# GNOME Sudoku is a GTK4 + libadwaita application written in Vala with a
# small C++ wrapper around qqwing. GTK 4, libadwaita, valac, libgee and
# json-glib come from the gnome extension (gnome-core26 SDK/content snaps).
# qqwing is not part of the platform, so its headers come from the 26.04
# archive at build time and its library is staged by the libraries part.
parts:
  gnome-sudoku:
    source: https://gitlab.gnome.org/GNOME/gnome-sudoku.git
    source-type: git
    source-tag: '51.0.1'
    source-depth: 1
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.Sudoku.metainfo.xml]
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    build-packages:
      - blueprint-compiler
      - libqqwing-dev
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # The help media symlinks would dangle in the snap.
      sed -i.bak -e 's|help_media,|help_media, symlink_media: false,|g' help/meson.build

  libraries:
    plugin: nil
    stage-packages:
      - libqqwing2v5
      # gnome-core26's librsvg needs libxml2, which the content snap lacks.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/*/libqqwing*
      - usr/lib/libxml2.so.*
