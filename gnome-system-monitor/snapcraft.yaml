name: gnome-system-monitor
adopt-info: gnome-system-monitor
contact: https://gitlab.gnome.org/GNOME/gnome-system-monitor/-/issues
summary: System Monitor
description: |
  GNOME System Monitor is a GNOME process viewer and system monitor with
  an attractive, easy-to-use interface, It has features, such as a tree
  view for process dependencies, icons for processes, the ability to hide
  processes that you don't want to see, graphical time histories of
  CPU/memory/swap usage, the ability to kill/renice processes needing root
  access, as well as the standard features that you might expect from a
  process viewer.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

plugs:
  run-systemd-sessions:
    interface: system-files
    read:
    - /run/systemd/sessions

slots:
  # for GtkApplication registration
  gnome-system-monitor:
    interface: dbus
    bus: session
    name: org.gnome.SystemMonitor

apps:
  gnome-system-monitor:
    extensions: [ gnome ]
    command: usr/bin/gnome-system-monitor
    environment:
      # gnome-core26 doesn't ship libXau, which libgtop links directly.
      # libXau is staged in usr/lib so the extension's cleanup does not drop
      # it, and $SNAP/usr/lib is put on the library path for the same reason;
      # the gnome extension only puts the platform there.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - mount-observe
      - network-observe
      - hardware-observe
      - system-observe
      - process-control
      - run-systemd-sessions
    desktop: usr/share/applications/org.gnome.SystemMonitor.desktop
    common-id: org.gnome.SystemMonitor.desktop

# System Monitor 51.1 is a GTK4 + libadwaita + gtkmm application. GTK 4,
# libadwaita, gtkmm, glibmm and libsigc++ are provided by the gnome extension
# (gnome-core26 SDK/content snaps); libgtop is not in the platform, so it is
# staged from the 26.04 archive by the libraries part below.
#
# Strict confinement limits the privileged actions: the process list only
# shows the snap's own view of the system unless system-observe,
# hardware-observe and process-control are connected, and "renice/kill as
# root" uses pkexec, which cannot escalate from inside the snap.
parts:
  gnome-system-monitor:
# ext:updatesnap
    source: https://gitlab.gnome.org/GNOME/gnome-system-monitor.git
    source-type: git
    source-tag: '51.1'
    source-depth: 1
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.SystemMonitor.metainfo.xml]
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dsystemd=true
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      sed -i.bak -e 's|Icon=@APP_ID@$|Icon=${SNAP}/meta/gui/org.gnome.SystemMonitor.svg|g'  ./data/org.gnome.SystemMonitor.desktop.in.in
      sed -i.bak -E -e 's|^(NotShowIn=.*)$|# \1|g' ./data/org.gnome.SystemMonitor.desktop.in.in
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/org.gnome.SystemMonitor.svg $CRAFT_PART_INSTALL/meta/gui/
      # D-Bus activation is provided by the dbus slot above (snapd writes a
      # service file that runs "snap run"). Upstream's own service file has a
      # host-absolute Exec and would launch the host application instead of
      # the confined snap, so do not ship it.
      rm -f $CRAFT_PART_INSTALL/usr/share/dbus-1/services/org.gnome.SystemMonitor.service
    build-packages:
      - libgtop2-dev

  libraries:
    after: [gnome-system-monitor]
    plugin: nil
    stage-packages:
      # gnome-core26 doesn't ship these, but gnome-system-monitor links them
      - libgtop-2.0-11
      # libgtop links libXau directly
      - libxau6
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libXau is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libXau.so.6"* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/*/libgtop*
      - usr/lib/libXau.so.*
