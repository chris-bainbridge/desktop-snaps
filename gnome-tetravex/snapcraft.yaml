name: gnome-tetravex
adopt-info: gnome-tetravex
summary: Reorder tiles to fit a square
description: |
  Each square piece has a number on each side. Position the pieces on the left
  side of the board so that the same numbers are next to each other. If the
  numbers don't match, you can't put the piece there. Move quickly: you're
  being timed!

  You can make the game easier or harder by changing the size of the board.

license: GPL-3.0+
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

# gnome-tetravex 3.38.3 (2025-09-18) is the latest stable upstream release;
# the project left the GNOME release sets after 3.38 and only receives
# translation updates on master. It is a GTK3 + Vala application, which the
# gnome extension still supports on core26 (the content snap ships GTK3).
#
# The application loads its icons from the icon theme and draws the board
# themes itself, so no extra libraries need to be bundled.

slots:
  # for GtkApplication registration
  gnome-tetravex:
    interface: dbus
    bus: session
    name: org.gnome.Tetravex

apps:
  gnome-tetravex:
    command: usr/bin/gnome-tetravex
    extensions: [ gnome ]
    plugs:
      - gsettings
    common-id: org.gnome.Tetravex.desktop
    desktop: usr/share/applications/org.gnome.Tetravex.desktop

parts:
  gnome-tetravex:
# ext:updatesnap
    source: https://gitlab.gnome.org/GNOME/gnome-tetravex.git
    source-type: git
    source-tag: '3.38.3'
    source-depth: 1
    parse-info: [usr/share/metainfo/org.gnome.Tetravex.appdata.xml]
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    build-packages:
      # gnome.yelp needs yelp-build; gnome-core26-sdk only ships itstool
      - yelp-tools
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    override-build: |
      # The help media symlinks would dangle in the snap.
      sed -i.bak -e 's|symlink_media: true|symlink_media: false|' $CRAFT_PART_SRC/help/meson.build
      # gtk-common-themes does not carry the application icon, so ship the
      # upstream icon in meta/gui and point the desktop file at it.
      sed -i.bak -e 's|Icon=org.gnome.Tetravex$|Icon=${SNAP}/meta/gui/org.gnome.Tetravex.svg|g' \
         $CRAFT_PART_SRC/data/org.gnome.Tetravex.desktop.in
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/org.gnome.Tetravex.svg \
         $CRAFT_PART_INSTALL/meta/gui/
