name: input-leap
version: '3.0.3'
title: Input Leap
contact: https://github.com/input-leap/input-leap/issues
summary: Share one keyboard, mouse and clipboard between computers
description: |
  Input Leap lets one keyboard and mouse control several computers on a
  desk: the server forwards input over the network to the clients when the
  pointer leaves its screen edge, and X11 clipboards can be shared.
  Release 3.0.3 (2025-06-13) is the last one; upstream archived the
  repository in July 2026.

  The snap is strictly confined, as required on Core Desktop. Input Leap
  3.0.3 has two Linux backends:

  - X11. Captures input with XGrabKeyboard()/XGrabPointer() and injects it
    with XTEST through the socket the x11 interface exposes. It works as
    intended only on a legacy X11 session. On Wayland, XWayland is a
    nested server: the compositor owns input and focus, so grabs apply
    only to focused XWayland windows and XTEST events reach only XWayland
    clients. Select it with --use-x11 (or --display); it is the fallback
    when no Wayland session is detected, and the GUI has no switch, so run
    input-leaps directly to force it.

  - libei (EI). The default on Wayland and the only backend that works
    with a native Wayland session under strict confinement. The server
    asks org.freedesktop.portal.InputCapture for permission and receives
    input through libei's EIS transport; the client uses
    org.freedesktop.portal.RemoteDesktop with ConnectToEIS. Ubuntu 26.04's
    GNOME 50 portal implements both. A strict snap reaches the portals
    over the session bus, which the desktop interface (connected
    automatically) allows. GNOME asks for permission when a session is
    created and starts capture only after the pointer crosses a
    screen-edge barrier; the dialog names the app "snap.input-leap". A
    compositor with these portals is required; otherwise start the server
    with --use-x11. Clipboard sharing is not implemented on this path.

  Not available, and not used by this release:

  - /dev/uinput: the interface is privileged, not auto-connected and not
    declared; 3.0.3 has no uinput backend.
  - /dev/input/event*: no evdev backend exists in 3.0.3; the joystick
    interface is not declared.
  - libei's non-portal mode (--disable-portal with LIBEI_SOCKET) cannot
    work: the host EIS socket is outside the reachable directories. Portal
    mode, the default, passes a descriptor over D-Bus instead of a path.

  Other strict-confinement limits:

  - Configuration, the TLS certificate and accepted fingerprints live in
    ~/snap/input-leap/current/.config/InputLeap, not ~/.config/InputLeap,
    and are not shared with a distribution package. /etc/input-leap.conf
    is not visible: use the GUI's config or --config with a home-directory
    path.
  - mDNS discovery uses the host avahi-daemon. Connect
    input-leap:avahi-observe and :avahi-control manually; without them,
    enter the peer address instead.
  - "log to file" cannot write to /var/log inside the sandbox; use the log
    pane or a file in the home directory.
  - There is no autostart service. Start the GUI and press Start, or run
    "snap run input-leap.input-leaps" / "snap run input-leap.input-leapc"
    in a terminal. The two command-line apps carry hidden desktop entries
    so snapd's portal-info lookup can identify them when started directly;
    without one the portals refuse the request.
  - The screen-change script option can only run files inside the snap or
    its private home area.
  - The tray icon is a Qt StatusNotifierItem on Wayland and an XEmbed
    icon on X11. GNOME Shell shows no StatusNotifierItem without an
    extension, so "minimize to tray" can hide the window with no icon;
    use the window instead.
  - core26 has only the XErrorDB part of libx11-data and no X11
    locale/compose data, so XIM input methods and Qt's compose sequences
    are unavailable by default (XCOMPOSEFILE can supply a compose file).
    Plain keysym handling and the libei backend are unaffected.
  - Qt 6.10 is staged from the 26.04 archive: snapcraft's KDE extensions
    support only core22/core24 and no KDE Frameworks are needed. Host Qt
    themes are not visible; Qt falls back to Fusion.
  - Drag and drop between machines is not implemented on Linux.

# Strict confinement is a hard requirement: these snaps target Core Desktop,
# which has no classic snaps. Input Leap is built from the pinned upstream
# release; the GUI is Qt 6 and the runtime libraries the platform lacks are
# staged from the 26.04 archive. No prebuilt Input Leap binaries are embedded.
#
# Qt approach: Input Leap supports Qt 5 (>= 5.9) and Qt 6 (>= 6.2) and
# defaults to Qt 6 (QT_DEFAULT_MAJOR_VERSION 6). snapcraft's kde-neon and
# kde-neon-6 extensions only support core22/core24, and no KDE Frameworks are
# used, so Qt 6.10.2 from the 26.04 archive is staged below. Qt's platform
# plugins (xcb in libqt6gui6, Wayland in libqt6waylandclient6 plus the
# xdg-shell integration) are staged too; Qt 6.10 prefers Wayland when
# WAYLAND_DISPLAY or XDG_SESSION_TYPE=wayland is present and falls back to
# xcb, so the GUI runs natively on Wayland with an XWayland fallback.
#
# Input backend approach: both Linux backends are built. X11 provides the
# legacy backend (and the only option on a real X11 session); libei provides
# the Wayland path through the InputCapture and RemoteDesktop portals. The
# choice is automatic (libei when WAYLAND_DISPLAY or LIBEI_SOCKET is set,
# otherwise X11) and --use-x11/--use-ei override it.
#
# Runtime approach: the gnome extension supplies the gnome-core26 platform
# (fonts, fontconfig, GLib/GIO, libportal, libXtst, libXi, libXinerama,
# libXrandr, libICE, libSM) and the gpu-2604 content snap (Mesa, libX11,
# libXext, libXfixes, libXau, libXdmcp, libxcb core, libwayland). The runtime
# part lists the packages those snaps lack; the extension's cleanup prunes
# anything the SDK or the platform already provides, and the cleanup part at
# the end drops shared libraries that core26 itself ships.
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26
# GPL-2.0 with an exemption that allows linking against OpenSSL.
license: GPL-2.0-only
website: https://github.com/input-leap/input-leap
source-code: https://github.com/input-leap/input-leap
issues: https://github.com/input-leap/input-leap/issues

icon: snap/local/input-leap.svg

platforms:
  amd64:
  arm64:

apps:
  input-leap:
    extensions: [gnome]
    command: usr/bin/input-leap
    desktop: usr/share/applications/io.github.input_leap.input-leap.desktop
    common-id: io.github.input_leap.input-leap
    # The gnome extension also adds desktop, desktop-legacy, opengl, wayland
    # and x11 to every app. They are listed here as well because they are
    # what makes the snap work: desktop allows the portal calls, wayland and
    # x11 are the display sockets, and opengl is the gpu-2604 content snap.
    # snapcraft merges the lists and removes the duplicates.
    plugs:
      - avahi-control  # register this machine's mDNS service; not automatic
      - avahi-observe  # browse for peers; not automatic
      - desktop        # portal access and snapctl user-open
      - desktop-legacy # legacy desktop paths used by Qt
      - home           # configuration files and logs in the user's home
      - network        # connect to the other machines
      - network-bind   # the server it starts listens on TCP 24800
      - opengl         # GPU access through the gpu-2604 content snap
      - wayland        # native Wayland session
      - x11            # X11 session, and XWayland on Wayland desktops

  input-leaps:
    # The server role. Started by the GUI, or with
    # "snap run input-leap.input-leaps"; the hidden desktop entry is needed
    # for snapd's portal-info when it is started directly. The extension
    # also gives it desktop (portal access), wayland/x11 (the display
    # sockets) and opengl.
    extensions: [gnome]
    command: usr/bin/input-leaps
    desktop: usr/share/applications/input-leaps.desktop
    plugs:
      - home           # configuration and --log files in the user's home
      - network        # connect to the clients and to the GUI's local IPC
      - network-bind   # listen on TCP 24800

  input-leapc:
    # The client role. Started by the GUI, or with
    # "snap run input-leap.input-leapc"; the extension adds desktop (portal
    # access) and wayland/x11 just as for the other apps.
    extensions: [gnome]
    command: usr/bin/input-leapc
    desktop: usr/share/applications/input-leapc.desktop
    plugs:
      - home           # --log files and trusted fingerprint database
      - network        # reach the server

parts:
  local:
    # The two hidden desktop entries. They make the command-line apps
    # identifiable to snapd's portal-info lookup, which xdg-desktop-portal
    # uses to build the app identity for the InputCapture and RemoteDesktop
    # portals. Snapcraft turns each of them into meta/gui/input-leaps.desktop
    # and meta/gui/input-leapc.desktop, which is what snapd exports. The
    # project icon lives here too but is not part of the payload; snapcraft
    # copies it to meta/gui/icon.svg for the exported desktop files.
    plugin: dump
    source: snap/local
    organize:
      input-leaps.desktop: usr/share/applications/input-leaps.desktop
      input-leapc.desktop: usr/share/applications/input-leapc.desktop
    prime:
      - -input-leap.svg

  input-leap:
    # v3.0.3 is the newest (and final) stable upstream release, 2025-06-13.
    # The GitHub archive contains the release tree; both git submodules
    # (googletest, gulrak-filesystem) are unused because tests are disabled
    # and C++17 std::filesystem is used.
    source: https://github.com/input-leap/input-leap/archive/refs/tags/v3.0.3.tar.gz
    source-checksum: sha256/fbbf6e3f99abccfc3592939a039daf13f0e003dd33764c7c591d354b1a6c07eb
    plugin: cmake
    override-pull: |
      craftctl default
      # XKBUtil.cpp uses size_t without including <cstddef>; upstream fixed
      # this right after v3.0.3 (commit 6b87931) for stricter compilers and
      # standard libraries that do not provide the type transitively.
      patch -p1 --batch \
        < "${CRAFT_PROJECT_DIR}/patches/0001-xkbutil-include-cstddef.patch"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      # The tarball has no .git, so do not let Version.cmake run git log.
      - -DINPUTLEAP_VERSION_DESC=release
      - -DQT_DEFAULT_MAJOR_VERSION=6
      - -DINPUTLEAP_BUILD_GUI=ON
      # The tests need GTest, Qt Test and an X server, and are not shipped.
      - -DINPUTLEAP_BUILD_TESTS=OFF
      # Both Linux backends: X11 for legacy sessions, libei for Wayland.
      - -DINPUTLEAP_BUILD_X11=ON
      - -DINPUTLEAP_BUILD_LIBEI=ON
      # C++17 std::filesystem instead of the bundled gulrak-filesystem.
      - -DINPUTLEAP_BUILD_GULRAK_FILESYSTEM=OFF
    build-packages:
      # The core26 build environment has a C++ compiler and make, but no
      # CMake, pkg-config, Qt, OpenSSL, Bonjour, X11, libei or libportal
      # headers.
      - build-essential
      - cmake
      - patch
      - pkgconf
      - qt6-base-dev          # Core, Gui, Widgets, Network, DBus, moc/uic/rcc
      - qt6-tools-dev         # Qt6LinguistTools (lrelease support)
      - qt6-l10n-tools        # lrelease, used for the embedded translations
      - libssl-dev            # TLS transport and certificate generation
      - libavahi-compat-libdnssd-dev  # dns_sd.h for the Zeroconf GUI
      - libx11-dev            # Xlib and XKB headers
      - libxtst-dev           # XTEST injection
      - libxi-dev             # XInput2, used to watch input
      - libxinerama-dev
      - libxrandr-dev
      - libxext-dev           # DPMS header
      - libice-dev            # session management, found by CMake
      - libsm-dev
      - libxkbcommon-dev      # EiKeyState and the libei backend
      - libglib2.0-dev        # GLib/GIO, required by the libei backend
      - libei-dev             # libei-1.0 >= 0.99.1
      - libportal-dev         # InputCapture and RemoteDesktop portals
    override-build: |
      craftctl default

      # Qt's compiled-in Prefix is /usr, which inside the snap is the core26
      # base. A qt.conf next to the GUI binary relocates Qt's plugin lookup
      # to the staged tree. Prefix is relative to usr/bin.
      cat > "$CRAFT_PART_INSTALL/usr/bin/qt.conf" <<EOF
      [Paths]
      Prefix = ..
      Plugins = lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
      Translations = share/qt6/translations
      EOF

  runtime:
    # Stage the Qt 6 and input runtime that the base and gnome-core26 lack.
    # The gnome/gpu cleanup parts remove whatever the SDK and content snaps
    # already provide, so this list can name the directly linked libraries
    # as well as the extras; only the missing pieces survive into the snap.
    after: [input-leap]
    plugin: nil
    stage-packages:
      # Qt 6.10.2 from the 26.04 archive.
      - libqt6core6t64
      - libqt6gui6        # xcb, minimal and offscreen platform plugins
      - libqt6widgets6
      - libqt6network6
      - libqt6dbus6       # StatusNotifierItem tray and QtDBus
      - libqt6opengl6     # needed by the Wayland client library
      # The Wayland platform plugin: libqt6waylandclient6 provides
      # libqwayland.so, libqt6wlshellintegration6 provides xdg-shell.
      - libqt6waylandclient6
      - libqt6wlshellintegration6
      # EI transport for the libei backend; gnome-core26 has no libei.
      - libei1
      # dns_sd.h's runtime, used by the GUI for mDNS; neither the base nor
      # gnome-core26 carries the Bonjour compatibility library.
      - libavahi-compat-libdnssd1
      # Qt 6.10's direct dependencies that the platform does not ship.
      - libb2-1
      - libdouble-conversion3
      - libmd4c0
      - libts0t64
      # The X libraries Input Leap links. The ones gnome-core26 has (libXtst,
      # libXi, libXinerama, libXrandr, libICE, libSM) are pruned by the
      # extension's cleanup; libX11, libXext, libXfixes, libXau, libXdmcp and
      # the core xcb library come from the gpu-2604 content snap at run time.
      - libx11-6
      - libx11-xcb1
      - libxext6
      - libxtst6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libice6
      - libsm6
      # Extensions of libxcb that Qt's xcb platform plugin loads. They are in
      # neither the base, gnome-core26 nor the Mesa content snap.
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-util1
      - libxcb-xinput0
      - libxcb-xkb1
      # The X11 integration library for libxkbcommon; gnome-core26 only ships
      # the core libxkbcommon, which Qt's xcb plugin cannot use without this.
      - libxkbcommon-x11-0
    prime:
      # Runtime packages do not need development files or documentation.
      - -usr/include
      - -usr/lib/*.la
      - -usr/lib/*/*.la
      - -usr/lib/pkgconfig
      - -usr/lib/*/pkgconfig
      - -usr/share/pkgconfig
      - -usr/share/doc
      - -usr/share/man
      # Plugins whose dependencies are not shipped and which a desktop Qt
      # app never loads. Keeping them would only produce loader warnings.
      - -usr/lib/*/qt6/plugins/generic/libqevdev*.so
      - -usr/lib/*/qt6/plugins/generic/libqlibinput*.so
      - -usr/lib/*/qt6/plugins/generic/libqtslib*.so
      - -usr/lib/*/qt6/plugins/imageformats/libqmng.so
      - -usr/lib/*/qt6/plugins/imageformats/libqtiff.so
      - -usr/lib/*/qt6/plugins/imageformats/libqwebp.so
      - -usr/lib/*/qt6/plugins/platforminputcontexts/libibus*.so

  cleanup:
    # The staged Qt dependency tree contains copies of libraries that the
    # core26 base already ships (libstdc++, glibc, OpenSSL, ...). Loading two
    # copies in one process is not safe, so drop every primed shared library
    # whose path also exists in the base, exactly as the other core26
    # recipes do. Libraries provided by gnome-core26 and gpu-2604 are
    # removed by the extension's own cleanup parts.
    after: [input-leap, runtime]
    plugin: nil
    build-snaps: [core26]
    override-prime: |
      set -eux
      root="$CRAFT_PRIME"
      cd /snap/core26/current
      find . -type f,l -name '*.so.*' -print |
        sed "s|^\./|$root/|" |
        xargs -r rm -f
