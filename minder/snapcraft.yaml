name: minder
adopt-info: minder
title: Minder
license: GPL-3.0-or-later
website: https://github.com/phase1geo/Minder
contact: https://github.com/phase1geo/Minder/issues
issues: https://github.com/phase1geo/Minder/issues
source-code: https://github.com/phase1geo/Minder
summary: Create, develop and visualize your ideas
description: |
  Minder is a mind-mapping application. It provides a clean interface with
  smooth animations and rich, expressive elements to help capture and
  organize ideas quickly and stay in the flow.

  Mind maps can be built with automatic tree layouts, Markdown-formatted node
  text, notes, tasks, images, LaTeX formulas and editable tables, and can be
  stylized with themes, stickers, tags, callouts and node groups. Maps can be
  imported from and exported to a wide range of formats, including FreeMind,
  Freeplane, OPML, XMind, Markdown, Mermaid, PDF, PNG, SVG and WebP.

  Strict-confinement notes:
   * Files under the home directory are accessible; other locations are only
     reachable through the file chooser (XDG document portal).
   * Physical printers are unavailable because the CUPS interface is not
     connected; printing to a PDF file still works.
   * The application/io.github.phase1geo.minder MIME type is only registered
     inside the snap, so the host file manager does not associate .minder
     files with Minder.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration (src/Application.vala)
  minder:
    interface: dbus
    bus: session
    name: io.github.phase1geo.minder

apps:
  minder:
    extensions: [gnome]
    command: usr/bin/io.github.phase1geo.minder
    desktop: usr/share/applications/io.github.phase1geo.minder.desktop
    common-id: io.github.phase1geo.minder.desktop
    plugs:
      # the snap's io.github.phase1geo.minder GSettings schema
      - gsettings
      # open and save mind maps
      - home
    environment:
      # libxml2 is staged in usr/lib below (see the libraries part); the
      # gnome extension only puts the platform on the library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR

# Minder 3.0.0 is a GTK4 + Granite 7 application written in Vala (meson
# build). GTK 4, WebKitGTK 6.0, GtkSourceView 5, librsvg, libwebp, libarchive
# and the Vala toolchain come from the gnome-core26 SDK/content snaps. Granite
# 7 and libmarkdown are not in the platform, and lasem has no 0.6 release in
# the 26.04 archive, so they are added below.
parts:
  # Minder renders LaTeX formulas through lasem; the 26.04 archive has no
  # lasem package at all, so build the 0.6 release the Flatpak uses.
  lasem:
    source: https://github.com/LasemProject/lasem.git
    source-type: git
    source-tag: '0.6.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dintrospection=disabled
      - -Dviewer=disabled
      - -Ddocumentation=disabled
    build-packages:
      # itex2mml's parser and lexer are generated at build time
      - bison
      - flex
    prime:
      # headers, pkg-config files and lasem-render are build-time only
      - usr/lib/*/liblasem-0.6.so.*

  minder:
    after: [lasem]
    source: https://github.com/phase1geo/Minder.git
    source-type: git
    source-tag: '3.0.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      # The only path compiled into the binary is LOCALEDIR; the gnome
      # extension redirects gettext and puts $SNAP/usr/share on XDG_DATA_DIRS,
      # where Minder looks up its icons, styles and language specs.
      - --buildtype=release
      - --prefix=/usr
    build-packages:
      # Granite 7 and libmarkdown are not in the gnome-core26 platform
      - libgranite-7-dev
      - libmarkdown2-dev
      # gnome-core26-sdk has libarchive's Vala binding but not its headers
      - libarchive-dev
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # use the icon bundled in the snap so it shows up in the launcher
      sed -i.bak -e 's|^Icon=io.github.phase1geo.minder$|Icon=${SNAP}/meta/gui/io.github.phase1geo.minder.svg|' \
        data/io.github.phase1geo.minder.desktop.in
    override-build: |
      craftctl default
      # meson skips gnome.post_install() when DESTDIR is set, so the GSettings
      # schema is never compiled. Minder creates its Gio.Settings objects at
      # start-up; make sure gschemas.compiled is present in the snap.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/scalable/io.github.phase1geo.minder.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/"

  libraries:
    after: [minder]
    plugin: nil
    stage-packages:
      # Granite 7 and libmarkdown are not in gnome-core26, but the app links
      # them directly
      - libgranite-7-7
      - libgranite-7-common
      - libmarkdown2
      # lasem and libgtksourceview-5 link libxml2. It is in the gnome-core26
      # SDK but not in the content snap.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/*/libgranite-7.so.*
      - usr/lib/*/libmarkdown.so.*
      - usr/lib/libxml2.so.*
      # Granite's elementary theme and translations
      - usr/share/themes/Granite
      - usr/share/locale/*/LC_MESSAGES/granite-7.mo
