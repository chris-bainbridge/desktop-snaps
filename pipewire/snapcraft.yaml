name: pipewire
base: core26
adopt-info: pipewire
summary: Pipewire server, plus wireplumber and pipewire-pulse
description: |
  The pipewire video/audio daemon server.

grade: stable
confinement: strict

# Explicit platforms: without this block snapcraft names the output after
# the host arch implicitly; declaring both keeps the amd64 and arm64 CI
# legs deterministic and the meta architectures per build arch.
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

layout:
  /usr/share/pipewire:
    bind: $SNAP/usr/share/pipewire
  /usr/share/wireplumber:
    bind: $SNAP/usr/share/wireplumber
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa
  /usr/share/alsa-card-profile:
    bind: $SNAP/usr/share/alsa-card-profile
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /etc/alsa:
    bind: $SNAP/etc/alsa
  /etc/pulse:
    bind: $SNAP/etc/pulse

environment:
  SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}/usr/lib:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3

apps:
  pipewire-bin:
    command: usr/bin/pipewire
    daemon: simple
    daemon-scope: user
    restart-condition: always
    sockets:
      pipewire-socket:
        listen-stream: $XDG_RUNTIME_DIR/pipewire-0
        socket-mode: 0644
      pipewire-manager-socket:
        listen-stream: $XDG_RUNTIME_DIR/pipewire-0-manager
        socket-mode: 0644
    before:
      - wireplumber-bin
    slots:
      - pipewire
      - audio-playback
      - audio-record
      - pulseaudio
    plugs:
      - alsa
      - bluez
      - camera
      - dbus-portal-desktop
      - hardware-observe
      - media-control
      - network
      - network-bind
      - system-observe

  wireplumber-bin:
    command: usr/bin/wireplumber
    daemon: simple
    daemon-scope: user
    restart-condition: always
    after:
      - pipewire-bin
    slots:
      - audio-playback
      - audio-record
      - pulseaudio
    plugs:
      - alsa
      - bluez
      - camera
      - dbus-portal-permission-store
      - hardware-observe
      - media-control
      - network
      - network-bind
      - system-observe

  pipewire-pulse:
    command: usr/bin/pipewire-pulse
    daemon: simple
    daemon-scope: user
    restart-condition: always
    sockets:
      pulse-socket:
        listen-stream: $XDG_RUNTIME_DIR/pulse/native
        socket-mode: 0644
    slots:
      - audio-playback
      - audio-record
      - pulseaudio
    plugs:
      - alsa
      - bluez
      - hardware-observe
      - network
      - network-bind
      - system-observe

  wpctl:
    command: usr/bin/wpctl
    slots:
      - pipewire

  wpexec:
    command: usr/bin/wpexec
    slots:
      - pipewire

  pw-play:
    command: usr/bin/pw-play
    slots:
      - pipewire

  pw-cat:
    command: usr/bin/pw-cat
    slots:
      - pipewire

  pw-cli:
    command: usr/bin/pw-cli
    slots:
      - pipewire

  pw-config:
    command: usr/bin/pw-config
    slots:
      - pipewire

  pw-dot:
    command: usr/bin/pw-dot
    slots:
      - pipewire

  pw-dsdplay:
    command: usr/bin/pw-dsdplay
    slots:
      - pipewire

  pw-dump:
    command: usr/bin/pw-dump
    slots:
      - pipewire

  pw-encplay:
    command: usr/bin/pw-encplay
    slots:
      - pipewire

  pw-link:
    command: usr/bin/pw-link
    slots:
      - pipewire

  pw-loopback:
    command: usr/bin/pw-loopback
    slots:
      - pipewire

  pw-metadata:
    command: usr/bin/pw-metadata
    slots:
      - pipewire

  pw-mididump:
    command: usr/bin/pw-mididump
    slots:
      - pipewire

  pw-midiplay:
    command: usr/bin/pw-midiplay
    slots:
      - pipewire

  pw-midirecord:
    command: usr/bin/pw-midirecord
    slots:
      - pipewire

  pw-mon:
    command: usr/bin/pw-mon
    slots:
      - pipewire

  pw-profiler:
    command: usr/bin/pw-profiler
    slots:
      - pipewire

  pw-record:
    command: usr/bin/pw-record
    slots:
      - pipewire

  pw-top:
    command: usr/bin/pw-top
    slots:
      - pipewire

slots:
  dbus-wireplumber:
    interface: dbus
    name: org.freedesktop.ReserveDevice1
    bus: session
  dbus-pulseaudio:
    interface: dbus
    name: org.pulseaudio.Server
    bus: session

plugs:
  dbus-portal-desktop:
    interface: dbus
    bus: session
    name: org.freedesktop.portal.Desktop
  dbus-portal-permission-store:
    interface: dbus
    bus: session
    name: org.freedesktop.impl.portal.PermissionStore

parts:
  # PipeWire and WirePlumber are built from upstream source: the 26.04 archive
  # still carries PipeWire 1.6.2 / WirePlumber 0.5.13, and this snap follows
  # the newest stable upstream releases instead.
  pipewire:
    source: https://github.com/PipeWire/pipewire/archive/refs/tags/1.6.11.tar.gz
    source-checksum: sha256/f3f70c4af173cc93d05070a9d412efe3ef5889bdf4ac32298e2c0d9ae1350559
    source-type: tar
    plugin: meson
    build-packages:
      - gettext
      - meson
      - ninja-build
      - libapparmor-dev
      - libasound2-dev
      - libavahi-client-dev
      - libbluetooth-dev
      - libdbus-1-dev
      - libfftw3-dev
      - libfreeaptx-dev
      - libglib2.0-dev
      - liblc3-dev
      - libldacbt-abr-dev
      - libldacbt-enc-dev
      - libncurses-dev
      - libopus-dev
      - libpulse-dev
      - libreadline-dev
      - libroc-dev
      - libsbc-dev
      - libsnapd-glib-dev
      - libsndfile1-dev
      - libspandsp-dev
      - libsystemd-dev
      - libudev-dev
      - libusb-1.0-0-dev
      - libwebrtc-audio-processing-dev
      - systemd-dev
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Dinstalled_tests=disabled
      # WirePlumber is a separate part below; do not let Meson fetch and
      # build it as a subproject.
      - -Dsession-managers=[]
      # The bluez5 SPA plugin replaces the archive's old
      # libspa-0.2-bluetooth deb, including the codecs that Ubuntu ships.
      - -Dbluez5=enabled
      - -Dbluez5-codec-aptx=enabled
      - -Dbluez5-codec-ldac=enabled
      - -Dbluez5-codec-lc3=enabled
      - -Dbluez5-codec-opus=enabled
      - -Dbluez5-plc-spandsp=enabled
      - -Dalsa=enabled
      - -Dv4l2=enabled
      - -Dudev=enabled
      - -Dlibusb=enabled
      - -Ddbus=enabled
      - -Dlibsystemd=enabled
      - -Dpw-cat=enabled
      - -Dsndfile=enabled
      - -Dfftw=enabled
      - -Dlibpulse=enabled
      - -Davahi=enabled
      - -Droc=enabled
      - -Draop=enabled
      # Snapd camera/permission integration for pipewire-pulse, as in the
      # archive package (libsnapd-glib is not part of the core26 base).
      - -Dsnap=enabled
      - -Decho-cancel-webrtc=enabled
      - -Dreadline=enabled
      - -Dgsettings=enabled
      # Features this snap does not ship (no corresponding apps or clients
      # inside the snap), and which would otherwise drag in extra libraries.
      - -Dpipewire-alsa=disabled
      - -Dpipewire-jack=disabled
      - -Dpipewire-v4l2=disabled
      - -Djack=disabled
      - -Dlibcamera=disabled
      - -Dlibcanberra=disabled
      - -Dlibmysofa=disabled
      - -Dlv2=disabled
      - -Dsdl2=disabled
      - -Dgstreamer=disabled
      - -Dffmpeg=disabled
      - -Dvulkan=disabled
      - -Dvolume=disabled
      - -Dlibffado=disabled
      - -Dselinux=disabled
    override-build: |
      craftctl default
      triplet="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      # WirePlumber's part builds against this part's stage, where the
      # installed prefix is not /usr. Point the two public .pc files at the
      # stage tree (header/lib paths); they are excluded from the snap below.
      for pc in libpipewire-0.3.pc libspa-0.2.pc; do
        sed -i "s|^prefix=.*|prefix=$CRAFT_STAGE/usr|" \
          "$CRAFT_PART_INSTALL/usr/lib/$triplet/pkgconfig/$pc"
      done
      # The layout binds /etc/alsa, so the bind source has to exist even
      # though nothing in this build writes there.
      mkdir -p "$CRAFT_PART_INSTALL/etc/alsa"
      craftctl set version="1.6.11"
    prime:
      # Build-only files: headers, pkg-config metadata and the ALSA client
      # plugins (the archive's pipewire-bin did not ship pipewire-alsa).
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/pkgconfig
      - -usr/lib/*/alsa-lib
      - -usr/share/alsa/alsa.conf.d
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian

  wireplumber:
    after: [pipewire]
    source: https://github.com/PipeWire/wireplumber/archive/refs/tags/0.5.19.tar.gz
    source-checksum: sha256/f9454eae3a5a6ca903c05ead2a7e47d7d3957fb0ffac3ebb11d92842603ae80f
    source-type: tar
    plugin: meson
    build-packages:
      - gettext
      - meson
      - ninja-build
      - libglib2.0-dev
      - liblua5.4-dev
      - libsystemd-dev
      - systemd-dev
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:$CRAFT_STAGE/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dtests=false
      # Use the archive's Lua instead of downloading the bundled subproject.
      - -Dsystem-lua=true
      - -Dsystem-lua-version=5.4
      - -Dsystemd=enabled
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/pkgconfig
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian

  # Runtime dependencies of the two source builds. Stage-packages resolve
  # their own dependency closure, so only the direct DT_NEEDED providers are
  # listed here; nothing pulls in the archive's 1.6.2 libpipewire/libspa.
  runtime:
    plugin: nil
    stage-packages:
      # ALSA data: alsa.conf/cards/pcm definitions and the UCM profiles.
      - libasound2-data
      - alsa-ucm-conf
      - libasound2t64
      - libavahi-client3
      - libbluetooth3
      - libfftw3-single3
      - libfreeaptx0
      - liblc3-1
      - libldacbt-abr2
      - libldacbt-enc2
      - liblua5.4-0
      - libopus0
      - libpulse0
      - libroc0.4
      - libsbc1
      - libsnapd-glib-2-1
      - libsndfile1
      - libspandsp2t64
      - libusb-1.0-0
      - libwebrtc-audio-processing-1-3
    override-build: |
      craftctl default
      libdir="$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      # libpulse and libproxy link their private helpers through a RUNPATH
      # pointing inside their own subdirectory, which is not on the snap's
      # library search path at run time. Expose the helpers next to the
      # public libraries so the DT_NEEDED closure holds inside the snap.
      for sub in pulseaudio libproxy; do
        for f in "$libdir/$sub"/*.so*; do
          [ -e "$f" ] || continue
          ln -sfn "$sub/$(basename "$f")" "$libdir/$(basename "$f")"
        done
      done
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
