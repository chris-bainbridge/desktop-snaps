name: atomix
adopt-info: atomix
title: Atomix
license: GPL-2.0-or-later
website: https://wiki.gnome.org/Apps/Atomix
contact: https://gitlab.gnome.org/GNOME/atomix/-/issues
issues: https://gitlab.gnome.org/GNOME/atomix/-/issues
source-code: https://gitlab.gnome.org/GNOME/atomix
summary: Build molecules out of single atoms
description: |
  Atomix is a puzzle game where your goal is to assemble molecules from
  compound atoms by moving them on the playfield. However, atoms don’t just
  move wherever you want to move them to, they slide until they hit either a
  wall or another atom.

  Try to build the molecules as fast as you can on each level to earn a
  higher score.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  atomix:
    interface: dbus
    bus: session
    name: org.gnome.atomix

apps:
  atomix:
    extensions: [gnome]
    command: usr/bin/atomix
    desktop: usr/share/applications/atomix.desktop
    common-id: atomix.desktop
    plugs:
      - gsettings

# 44.0 is the latest upstream release (2023-03-17); the game is a GTK3 +
# libgnome-games-support-1 application.
#
# The prefix is the runtime mount path, not /usr: the binary has PKGDATADIR,
# DATADIR and GNOMELOCALEDIR compiled in (themes, levels, logo and
# translations), and a /usr prefix would make it look in the core26 base.
# organize moves the installed tree back under usr/.
#
# gnome-core26 ships the GTK3 libgnome-games-support-2 ABI, not the -1 ABI
# this release links, so 1.8.2 is staged from the 26.04 archive. The rest of
# the runtime (GTK3, libgee) comes from the content snap.
parts:
  atomix:
    source: https://gitlab.gnome.org/GNOME/atomix.git
    source-type: git
    source-tag: '44.0'
    source-depth: 1
    plugin: meson
    parse-info: [usr/share/metainfo/atomix.appdata.xml]
    meson-parameters:
      - --prefix=/snap/atomix/current/usr
      - --buildtype=release
    organize:
      snap/atomix/current/usr: usr
    build-packages:
      - libgnome-games-support-1-dev
      # msgfmt --xml for the translated level files (data/level/*.in)
      - itstool
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # Use the icon bundled in the snap so the launcher does not have to
      # find it in the host theme.
      sed -i.bak -e 's|^Icon=atomix$|Icon=${SNAP}/meta/gui/org.gnome.atomix.png|' \
        data/atomix.desktop.in
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/hicolor/256x256/apps/atomix.png" \
        "$CRAFT_PART_INSTALL/meta/gui/org.gnome.atomix.png"

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26 ships libgnome-games-support-2, not the GTK3 -1 ABI
      - libgnome-games-support-1-3
    prime:
      # everything else this pulls in (GTK3, cairo, pango, libgee, ...) is
      # provided by gnome-core26; keep only the library and its translations
      - usr/lib/*/libgnome-games-support*
      - usr/share/locale/*/LC_MESSAGES/libgnome-games-support.mo
