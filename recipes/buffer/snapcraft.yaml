name: buffer
adopt-info: buffer
title: Buffer
license: GPL-3.0-or-later
contact: https://gitlab.gnome.org/cheywood/Buffer/-/issues
issues: https://gitlab.gnome.org/cheywood/Buffer/-/issues
source-code: https://gitlab.gnome.org/cheywood/Buffer
website: https://gitlab.gnome.org/cheywood/Buffer
summary: Minimal text editor for ephemeral notes
description: |
  Celebrating transience, Buffer provides a minimal editing space for all
  those things that don't need keeping. It is designed for keyboard workflows
  on the desktop: a single text view with search, line numbers, font size and
  theme selection, and optional spell checking.

  Strict-confinement notes:
   * Files under the home directory are accessible; other locations are only
     reachable through the file chooser (XDG document portal).
   * Spell checking uses libspelling with the en_US dictionary shipped in
     gnome-core26. Dictionaries for other languages installed on the host are
     not visible.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration and D-Bus activation
  # (data/org.gnome.gitlab.cheywood.Buffer.service.in)
  buffer:
    interface: dbus
    bus: session
    name: org.gnome.gitlab.cheywood.Buffer

apps:
  buffer:
    extensions: [gnome]
    command: usr/bin/buffer
    desktop: usr/share/applications/org.gnome.gitlab.cheywood.Buffer.desktop
    common-id: org.gnome.gitlab.cheywood.Buffer.desktop
    environment:
      # gnome-core26's libgtksourceview-5 links libxml2, which the content
      # snap does not ship. The libraries part below bundles it in usr/lib.
      # The gnome extension only puts the platform on the library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      # the snap's org.gnome.gitlab.cheywood.Buffer GSettings schema
      - gsettings
      # open and save files
      - home

# Buffer 2026.1 is a Rust + GTK4/libadwaita application (GtkSourceView 5 text
# view, libspelling for spell checking). Upstream switched from Vala to Rust
# in 0.10.0; the Meson build drives cargo itself on the upstream Cargo.lock
# (src/meson.build).
#
# GTK 4, libadwaita, GtkSourceView 5, gettext and pkg-config come from the
# gnome-core26 SDK/content snaps. cargo and rustc are not part of the
# platform; the 26.04 archive has 1.93.1, which satisfies the crates' MSRV.
# libspelling is not in the platform either, so both its headers (for the
# libspelling crate's pkg-config probe) and its runtime library are taken
# from the 26.04 archive.
#
# The prefix is the runtime mount path, not /usr: the binary has PKGDATADIR
# (buffer.gresource), LOCALEDIR and the D-Bus service Exec line compiled in,
# and a /usr prefix would resolve them to the core26 base instead of the
# snap. organize moves the installed tree back under usr/.
parts:
  buffer:
    source: https://gitlab.gnome.org/cheywood/Buffer.git
    source-type: git
    source-tag: '2026.1'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/snap/buffer/current/usr
      - --buildtype=release
    organize:
      snap/buffer/current/usr: usr
    build-packages:
      - cargo
      - rustc
      # libspelling-1.pc for the Rust libspelling crate; gnome-core26-sdk
      # does not ship libspelling
      - libspelling-1-dev
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # use the icon bundled in the snap so it shows up in the launcher
      sed -i.bak -e 's|^Icon=@ICON@$|Icon=${SNAP}/meta/gui/org.gnome.gitlab.cheywood.Buffer.svg|g' \
        "$CRAFT_PART_SRC/data/org.gnome.gitlab.cheywood.Buffer.desktop.in.in"
    override-build: |
      craftctl default
      # meson skips gnome.post_install() when DESTDIR is set, so the GSettings
      # schema is never compiled. Buffer creates its Gio.Settings object at
      # start-up; make sure gschemas.compiled is present in the snap.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/snap/buffer/current/usr/share/glib-2.0/schemas"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/hicolor/scalable/apps/org.gnome.gitlab.cheywood.Buffer.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/"
    prime:
      # don't include files needed to develop against the app
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/gir-1.0
      - -usr/share/vala
      - -usr/share/gtk-doc
      - -usr/share/man
      - -usr/share/doc

  libraries:
    after: [buffer]
    plugin: nil
    stage-packages:
      # gnome-core26 has no libspelling, but Buffer's spell checker links it
      - libspelling-1-2
      # gnome-core26 has no libxml2, but libgtksourceview-5 links it directly
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/*/libspelling-1.so.*
      - usr/lib/libxml2.so.*
