name: decibels
adopt-info: decibels
title: Audio Player
summary: Audio player for GNOME
description: |
  Audio Player (Decibels) is a simple audio player for GNOME. It plays audio
  files without asking for an organised music library: open a file, see its
  waveform, adjust the playback speed, seek, and play several files at once.

  Playback is powered by GStreamer. The GNOME platform already provides the
  base and good plugin sets (MP3, FLAC, Ogg Vorbis, Opus, Speex, WAV, WavPack
  and MP4); this snap adds the AAC, AIFF, ASF/WMA and Musepack plugins and the
  libav decoders for APE, ALAC, AC-3 and DTS, which the platform lacks.

  Strict-confinement notes:
   * Audio files are read from the home directory; other locations are only
     reachable through the file chooser (XDG document portal).
   * Playback goes to the desktop's PulseAudio/PipeWire server through the
     audio-playback interface.
   * MPRIS controls are exported to the desktop's media widget.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26
license: GPL-3.0-or-later
contact: https://gitlab.gnome.org/GNOME/decibels/-/issues
website: https://apps.gnome.org/Decibels/
source-code: https://gitlab.gnome.org/GNOME/decibels
issues: https://gitlab.gnome.org/GNOME/decibels/-/issues

platforms:
  amd64:
  arm64:

layout:
  # The launcher generated from src/org.gnome.Decibels.in is run with the
  # gjs-console from the GNOME platform (see the override-pull below); the
  # compiled-in path is /usr/bin/gjs-console, which only exists in the
  # platform snap.
  /usr/bin/gjs-console:
    symlink: $SNAP/gnome-platform/usr/bin/gjs-console

slots:
  # for GtkApplication registration and D-Bus activation
  # (data/org.gnome.Decibels.service.in)
  decibels:
    interface: dbus
    bus: session
    name: org.gnome.Decibels
  # MPRIS remote control (src/mpris.ts registers
  # org.mpris.MediaPlayer2.<application id>)
  mpris:
    interface: dbus
    bus: session
    name: org.mpris.MediaPlayer2.org.gnome.Decibels

plugs:
  desktop:
    desktop-file-ids:
      - org.gnome.Decibels

apps:
  decibels:
    extensions: [gnome]
    command: usr/bin/org.gnome.Decibels
    desktop: usr/share/applications/org.gnome.Decibels.desktop
    common-id: org.gnome.Decibels.desktop
    environment:
      # The staged GStreamer plugins and libav, and the libxml2 copy that the
      # libraries part moves to $SNAP/usr/lib, are not on the gnome
      # extension's library path. Defining LD_LIBRARY_PATH here replaces
      # snapcraft's default, so list both directories.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - gsettings      # theme, fonts and the app's own preferences
      - home           # the audio files the user opens
      - audio-playback # playback through the desktop's PulseAudio/PipeWire

# Decibels 49.6.1 is a TypeScript/GJS application built with Meson. GTK 4,
# libadwaita 1.8, GStreamer 1.28 and gjs 1.90 come from the gnome-core26
# content snap; the SDK supplies their development files. The TypeScript
# compiler is not part of the SDK, and neither is blueprint-compiler, which
# compiles the .blp UI files in data/.
#
# The prefix is the runtime mount path: the launcher script, the D-Bus service
# file and gjs' package module all use the compiled-in prefix/datadir to find
# the resources at run time, and a /usr prefix would resolve them inside the
# base. organize moves the installed tree back under usr/.
#
# The app's GI imports (Gst, GstAudio, GstPbutils, GstPlay, Graphene, Gsk, ...)
# and the gjs package/gettext modules are all present in gnome-core26, so no
# typelib or JS module needs staging.
parts:
  decibels:
    source: https://gitlab.gnome.org/GNOME/decibels.git
    source-type: git
    source-tag: '49.6.1'
    source-depth: 1
    # gi-types provides the GJS TypeScript typings used by tsc.
    source-submodules:
      - gi-types
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.Decibels.metainfo.xml]
    meson-parameters:
      - --prefix=/snap/decibels/current/usr
      - --buildtype=release
    organize:
      snap/decibels/current/usr: usr
    build-packages:
      - blueprint-compiler # data/*.blp -> GtkBuilder XML
      - node-typescript    # tsc, invoked by the src/meson.build custom target
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # Use the gjs-console from the platform snap, which the layout exposes
      # at the compiled-in path.
      sed -i '1s|^#!.*|#!/usr/bin/gjs-console -m|' src/org.gnome.Decibels.in
    override-build: |
      craftctl default
      # Use the icon bundled in the snap so it shows up in the launcher.
      sed -i 's|^Icon=org.gnome.Decibels$|Icon=${SNAP}/meta/gui/org.gnome.Decibels.svg|' \
        "$CRAFT_PART_INSTALL/snap/decibels/current/usr/share/applications/org.gnome.Decibels.desktop"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/hicolor/scalable/apps/org.gnome.Decibels.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/"
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/pkgconfig
      - -usr/share/man

  # gnome-core26 ships the GStreamer base and good plugin sets plus a few ugly
  # plugins, but nothing from the bad set and no libav. The full
  # gstreamer1.0-plugins-bad pulls in the ONNX/TensorFlow/OpenCV decoder stack,
  # so fetch the packages without their dependencies and keep only the plugins
  # an audio player needs:
  # aiffparse, the ASF/WMA demuxer and decoders, the AAC decoder (faad) and
  # the Musepack decoder. Their remaining dependencies are in the platform.
  gst-extras:
    plugin: nil
    override-build: |
      set -eux
      cd "$CRAFT_PART_BUILD"
      apt-get download gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      for package in ./*.deb; do
        dpkg-deb -x "$package" "$CRAFT_PART_INSTALL"
      done
    stage:
      - usr/lib/*/gstreamer-1.0/libgstaiff.so     # AIFF demuxing
      - usr/lib/*/gstreamer-1.0/libgstasf.so      # ASF/WMA demuxing and decoding
      - usr/lib/*/gstreamer-1.0/libgstfaad.so     # AAC/HE-AAC decoding
      - usr/lib/*/gstreamer-1.0/libgstmusepack.so # Musepack (MPC) decoding

  # libav supplies the decoders the platform and the plugins above do not
  # ship: APE, ALAC, AC-3, DTS and the remaining WMA variants. The other two
  # packages are the only non-platform dependencies of the bad/ugly plugins
  # kept by gst-extras.
  libraries:
    after: [decibels]
    plugin: nil
    stage-packages:
      - gstreamer1.0-libav
      - libfaad2     # libgstfaad.so
      - libmpcdec6   # libgstmusepack.so
      # libavformat links libxml2, which gnome-core26 does not ship.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the multiarch path; the app's
      # LD_LIBRARY_PATH includes $SNAP/usr/lib.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
        "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/*.la
      - -usr/share/doc
      - -usr/share/doc-base
      - -usr/share/man
      - -usr/share/lintian
      # libav's dependencies also stage these libraries, but gnome-core26 and
      # the SDK ship their own copies; drop the duplicates so only one version
      # of each is present in the snap.
      - -usr/lib/*/libcairo.so.*
      - -usr/lib/*/libcairo-gobject.so.*
      - -usr/lib/*/libfontconfig.so.*
      - -usr/lib/*/libgdk_pixbuf-2.0.so.*
      - -usr/lib/*/libharfbuzz.so.*
      - -usr/lib/*/libpango-1.0.so.*
      - -usr/lib/*/libpangocairo-1.0.so.*
      - -usr/lib/*/libpangoft2-1.0.so.*
      - -usr/lib/*/librsvg-2.so.*

  cleanup:
    after: [decibels, gst-extras, libraries]
    plugin: nil
    build-snaps: [gnome-core26]
    override-prime: |
      set -eux
      # Staging libav and the GStreamer plugins pulls in copies of libraries,
      # plugins and GSettings schemas that the gnome-core26 content snap
      # already provides. Drop every primed file whose path also exists in the
      # content snap, so the platform copy is the one that is loaded.
      cd /snap/gnome-core26/current
      find usr/lib usr/share/glib-2.0 -type f -o -type l | while IFS= read -r file; do
        rm -f "$CRAFT_PRIME/$file"
      done
