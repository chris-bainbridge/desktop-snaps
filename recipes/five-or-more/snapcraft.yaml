name: five-or-more
adopt-info: five-or-more
summary: GNOME five-or-more
description: |
  Five or More is the GNOME port of the once popular Windows game called Color Lines.
  The game's objective is to align as often as possible five or more objects of the
  same color and shape causing them to disappear.
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

layout:
  /usr/share/five-or-more/themes:
    bind: $SNAP/usr/share/five-or-more/themes

slots:
  # for GtkApplication registration
  five-or-more:
    interface: dbus
    bus: session
    name: org.gnome.five-or-more

apps:
  five-or-more:
    command: usr/bin/five-or-more
    extensions: [ gnome ]
    plugs:
      - gsettings
    desktop: usr/share/applications/org.gnome.five-or-more.desktop
    common-id: org.gnome.five-or-more.desktop

parts:
  five-or-more:
    source: https://gitlab.gnome.org/GNOME/five-or-more.git
    source-type: git
    source-tag: '48.1'
    source-depth: 1
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    override-build: |
      sed -i.bak -e 's|Icon=org.gnome.five-or-more$|Icon=${SNAP}/meta/gui/org.gnome.five-or-more.png|g' $CRAFT_PART_SRC/data/org.gnome.five-or-more.desktop.in
      craftctl default
      # meson skips gnome.post_install() when DESTDIR is set, so the GSettings
      # schema is never compiled. five-or-more creates its Gio.Settings
      # objects at start-up; make sure gschemas.compiled is in the snap.
      glib-compile-schemas $CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/256x256/org.gnome.five-or-more.png $CRAFT_PART_INSTALL/meta/gui/
    plugin: meson
    meson-parameters: [--prefix=/usr]
    build-packages:
      # not shipped by the gnome-core26 SDK
      - libgnome-games-support-1-dev
    parse-info: [usr/share/metainfo/org.gnome.five-or-more.metainfo.xml]

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26 ships libgnome-games-support-2, not the GTK3 -1 ABI
      - libgnome-games-support-1-3
    prime:
      # everything else this pulls in (GTK3, cairo, pango, librsvg, ...) is
      # provided by gnome-core26; keep only the library and its translations
      - usr/lib/*/libgnome-games-support*
      - usr/share/locale/*/LC_MESSAGES/libgnome-games-support.mo
