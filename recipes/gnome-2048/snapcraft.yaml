name: gnome-2048
adopt-info: gnome-2048
title: GNOME 2048
license: GPL-3.0-or-later
contact: https://gitlab.gnome.org/GNOME/gnome-2048/-/issues
grade: stable
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  gnome-2048:
    interface: dbus
    bus: session
    name: org.gnome.TwentyFortyEight

apps:
  gnome-2048:
    extensions: [gnome]
    command: usr/bin/gnome-2048
    desktop: usr/share/applications/org.gnome.TwentyFortyEight.desktop
    common-id: org.gnome.TwentyFortyEight
    plugs:
      - gsettings

# 2048 50.2 is a Rust + GTK4/libadwaita rewrite of the old Clutter/GTK3
# application. Its Meson build drives cargo itself (upstream Cargo.lock) and
# builds libgnome-games-support as a bundled, statically linked meson
# subproject, so there is no separate runtime library to stage.
#
# GTK 4, libadwaita, valac, gettext and yelp-tools come from the gnome-core26
# SDK/content snaps; cargo and rustc are not part of the platform, the 26.04
# archive has them.
#
# The prefix is the runtime mount path, not /usr: the Rust binary has
# LOCALEDIR compiled in from the meson prefix, and a /usr prefix would make
# gettext look in the core26 base instead of the snap. organize moves the
# installed tree back under usr/.
parts:
  gnome-2048:
    source: https://gitlab.gnome.org/GNOME/gnome-2048.git
    source-type: git
    source-tag: '50.2'
    source-depth: 1
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.TwentyFortyEight.metainfo.xml]
    meson-parameters:
      - --prefix=/snap/gnome-2048/current/usr
      - --buildtype=release
    organize:
      snap/gnome-2048/current/usr: usr
    build-packages:
      - cargo
      - rustc
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # Help media symlinks would dangle in the snap.
      sed -i -e "s|'gnome-2048',|'gnome-2048', symlink_media: false,|" help/meson.build
    override-build: |
      craftctl default
      # meson's gnome.post_install() is skipped when DESTDIR is set, which is
      # how snapcraft installs. Compile the schema here so GSettings can
      # resolve org.gnome.TwentyFortyEight on first run.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/snap/gnome-2048/current/usr/share/glib-2.0/schemas"
      # Use the icon bundled in the snap so the launcher does not have to
      # find it in the host theme.
      sed -i 's|^Icon=org.gnome.TwentyFortyEight$|Icon=${SNAP}/meta/gui/org.gnome.TwentyFortyEight.svg|' \
        "$CRAFT_PART_INSTALL/snap/gnome-2048/current/usr/share/applications/org.gnome.TwentyFortyEight.desktop"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/org.gnome.TwentyFortyEight.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/org.gnome.TwentyFortyEight.svg"
