name: gnome-boxes
adopt-info: gnome-boxes
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

layout:
  /usr/share/OVMF:
    bind: $SNAP/usr/share/OVMF
  /usr/share/gnome-boxes:
    bind: $SNAP/usr/share/gnome-boxes
  /usr/share/osinfo:
    bind: $SNAP/usr/share/osinfo
  /usr/share/misc/usb.ids:
    symlink: $SNAP/usr/share/misc/usb.ids
  /usr/share/misc/pci.ids:
    symlink: $SNAP/usr/share/misc/pci.ids
  /usr/share/libosinfo/pci.ids:
    symlink: $SNAP/usr/share/libosinfo/pci.ids
  /usr/share/libosinfo/usb.ids:
    symlink: $SNAP/usr/share/libosinfo/usb.ids
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvirt:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvirt
  # QEMU loads the SPICE and OpenGL display backends as modules from its
  # compiled-in module directory, which is outside $SNAP.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qemu:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qemu
  /usr/share/libvirt:
    bind: $SNAP/usr/share/libvirt
  /usr/lib/libvirt:
    bind: $SNAP/usr/lib/libvirt
  /usr/share/seabios:
    bind: $SNAP/usr/share/seabios
  /usr/lib/ipxe:
    bind: $SNAP/usr/lib/ipxe
  /usr/bin/qemu-system-x86_64:
    bind-file: $SNAP/usr/bin/qemu-system-x86_64
  /usr/bin/qemu-system-aarch64:
    bind-file: $SNAP/usr/bin/qemu-system-aarch64
  /usr/bin/qemu-img:
    symlink: $SNAP/usr/bin/qemu-img
  /usr/sbin/virtchd:
    symlink: $SNAP/usr/sbin/virtchd
  /usr/sbin/virtinterfaced:
    symlink: $SNAP/usr/sbin/virtinterfaced
  /usr/sbin/virtlockd:
    symlink: $SNAP/usr/sbin/virtlockd
  /usr/sbin/virtlogd:
    symlink: $SNAP/usr/sbin/virtlogd
  /usr/sbin/virtlxcd:
    symlink: $SNAP/usr/sbin/virtlxcd
  /usr/sbin/virtnetworkd:
    symlink: $SNAP/usr/sbin/virtnetworkd
  /usr/sbin/virtnodedevd:
    symlink: $SNAP/usr/sbin/virtnodedevd
  /usr/sbin/virtnwfilterd:
    symlink: $SNAP/usr/sbin/virtnwfilterd
  /usr/sbin/virtproxyd:
    symlink: $SNAP/usr/sbin/virtproxyd
  /usr/sbin/virtqemud:
    symlink: $SNAP/usr/sbin/virtqemud
  /usr/sbin/virt-sanlock-cleanup:
    symlink: $SNAP/usr/sbin/virt-sanlock-cleanup
  /usr/sbin/virtsecretd:
    symlink: $SNAP/usr/sbin/virtsecretd
  /usr/sbin/virtstoraged:
    symlink: $SNAP/usr/sbin/virtstoraged
  /usr/sbin/virtvboxd:
    symlink: $SNAP/usr/sbin/virtvboxd
  /usr/sbin/virtxend:
    symlink: $SNAP/usr/sbin/virtxend
  /usr/sbin/dnsmasq:
    bind-file: $SNAP/usr/sbin/dnsmasq
  /usr/libexec/spice-client-glib-usb-acl-helper:
    symlink: $SNAP/usr/libexec/spice-client-glib-usb-acl-helper
  /usr/share/qemu:
    bind: $SNAP/usr/share/qemu
  /etc/libvirt:
    bind: $SNAP/etc/libvirt
  /usr/libexec/libvirt_iohelper:
    bind-file: $SNAP/usr/libexec/libvirt_iohelper
  /var/lib/libvirt:
    bind: $SNAP/var/lib/libvirt

slots:
  # for GtkApplication registration
  gnome-boxes:
    interface: dbus
    bus: session
    name: org.gnome.Boxes

apps:
  gnome-boxes:
    command: usr/bin/gnome-boxes
    command-chain: [ bin/launcher ]
    extensions: [gnome]
    plugs:
      - audio-record
      - audio-playback
      - camera
      - gsettings
      - hardware-observe
      - home
      - kvm
      - login-session-observe
      - mount-observe
      - network
      - network-bind
      - network-status
      - process-control
      - raw-usb
      - removable-media
      - system-observe
      - time-control
      - udisks2
      - upower-observe
    desktop: usr/share/applications/org.gnome.Boxes.desktop
    common-id: org.gnome.Boxes.desktop
    environment:
      # The gnome extension's desktop-launch only adds the gnome-core26
      # runtime to LD_LIBRARY_PATH; the libraries shipped in $SNAP/usr/lib
      # (libvirt, libosinfo, spice-gtk, gtk-vnc and libxml2) and the private
      # libovf build need to be on the path explicitly.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gnome-boxes
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gnome-boxes/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}
      GTK_USE_PORTAL: '0'
      LIBVIRT_DEFAULT_URI: 'qemu+unix:///session'

parts:
  libpciaccess:
    source: https://gitlab.freedesktop.org/xorg/lib/libpciaccess.git
    source-depth: 1
    source-tag: libpciaccess-0.19
    plugin: meson
    build-packages:
      - zlib1g-dev
      - xutils-dev
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dzlib=enabled
      - -Dpci-ids=/usr/share/misc
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  libvirt:
    source: https://gitlab.com/libvirt/libvirt.git
    source-depth: 1
    source-tag: 'v12.6.0'
# There's something, starting from 10.5.0 that breaks libvirt to work inside
# the snap environment, launching `virsh` just hangs and inside boxes no VM
# is loaded, with an infinite loading spinner.
# ext:updatesnap
#   version-format:
#     lower-than: 13.0.0
    plugin: meson
    after:
      - libpciaccess
    build-packages:
      - libxml2-dev
      - libncurses-dev
      - libreadline-dev
      - zlib1g-dev
      - libgcrypt20-dev
      - libgnutls28-dev
      - libsasl2-dev
      - libxen-dev
      - libparted-dev
      - libdevmapper-dev
      - uuid-dev
      - libudev-dev
      - libcurl4-gnutls-dev
      - libpolkit-gobject-1-dev
      - libcap-ng-dev
      - libnl-3-dev
      - libnl-route-3-dev
      - libyajl-dev
      - libpcap0.8-dev
      - libnuma-dev
      - libsanlock-dev
      - libaudit-dev
      - libselinux-dev
      - libapparmor-dev
      - libdbus-1-dev
      - systemtap-sdt-dev
      - libzfslinux-dev
      - librbd-dev
      - librados-dev
      - libglusterfs-dev
      - libjson-c-dev
      - libtirpc-dev
      - libwiretap-dev
      - libfuse-dev
      - qemu-utils
      - python3-docutils
      - qemu-system-common
      - xsltproc
      - libxslt1-dev
    stage-packages:
      - libacl1
      - libapparmor1
      - libaudit1
      - libblkid1
      - libcap-ng0
      - libcurl3t64-gnutls
      - libdbus-1-3
      - libdevmapper1.02.1
      - libfuse2t64
      - libgcc-s1
      - libgfapi0
      - libgfrpc0
      - libgfxdr0
      - libglib2.0-0t64
      - libglusterfs0
      - libgnutls30t64
      - libjson-c5
      - libnl-3-200
      - libnuma1
      - libparted2t64
      - libpcap0.8t64
      - librados2
      - librbd1
      - libsanlock-client1
      - libsasl2-2
      - libselinux1
      - libtirpc3t64
      - libudev1
      - libxencall1
      - libxenmisc4.20
      - libxendevicemodel1
      - libxenevtchn1
      - libxenforeignmemory1
      - libxengnttab1
      - libxenstore4
      - libxentoolcore1
      - libxentoollog1
      - libyajl2
    build-environment:
      - CFLAGS: "-Wno-error"
    override-pull: |
      craftctl default
      git apply $CRAFT_PROJECT_DIR/patches/libvirt-qemu.patch
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Ddriver_qemu=enabled
      - -Ddocs=disabled
      - -Dtests=disabled
      - -Dwireshark_dissector=disabled
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  libvirt-glib:
    source: https://github.com/libvirt/libvirt-glib.git
    source-tag: v5.0.0
    after: [ libvirt ]
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    prime:
      - usr/lib/*/*.so.*

  libosinfo:
    source: https://gitlab.com/libosinfo/libosinfo.git
    source-commit: 08f0772b7da207acc6015eec2d873c6ada3c2f8e
    source-depth: 1
    plugin: meson
    # Let meson find the ID databases in the build environment instead of
    # downloading them during configure; they are installed below
    # /usr/share/libosinfo and are looked up through the layout at run time.
    build-packages:
      - pci.ids
      - usb.ids
    meson-parameters:
      - --prefix=/usr
      - -Denable-gtk-doc=false
      - -Denable-tests=false
      - -Dlibsoup-abi=3.0
    override-build: |
      craftctl default
      sed -i "s#includedir=/usr/include#includedir=$CRAFT_STAGE/usr/include#g" $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/libosinfo-1.0.pc
      sed -i "s#libdir=/usr/lib#libdir=$CRAFT_STAGE/usr/lib#g" $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/libosinfo-1.0.pc
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  libspice-protocol:
    source: https://gitlab.freedesktop.org/spice/spice-protocol.git
    source-tag: 'v0.14.5'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/pkgconfig

  gst-gir:
    # GStreamer 1.28 ships Gst-1.0.gir and GstAudio-1.0.gir in the
    # arch-specific gir-1.0 directory, but g-ir-scanner only looks in
    # $CRAFT_STAGE/usr/share/gir-1.0 (where the SDK keeps the other Gst
    # girs). Publish them there for spice-gtk's introspection build; they
    # are build-only and are not primed into the snap.
    plugin: nil
    build-packages:
      - libgstreamer-plugins-base1.0-dev
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/gir-1.0"
      cp /usr/lib/"$CRAFT_ARCH_TRIPLET_BUILD_FOR"/gir-1.0/*.gir \
         "$CRAFT_PART_INSTALL/usr/share/gir-1.0/"
    prime:
      - -usr/share/gir-1.0

  libspice-gtk:
    after: [ libspice-protocol, gst-gir ]
    source: https://gitlab.freedesktop.org/spice/spice-gtk.git
    source-tag: 'v0.43'
    source-depth: 1
    plugin: meson
    override-pull: |
      python3 -m pip install --break-system-packages six pyparsing asciidoc
      craftctl default
      git apply -3 $CRAFT_PROJECT_DIR/patches/libspice-gtk-permissions-error-explain.patch
    meson-parameters:
      - --prefix=/usr
      - -Dgtk=enabled
      - -Dwayland-protocols=enabled
      - -Dintrospection=enabled
      - -Dgtk_doc=disabled
      - -Dsmartcard=enabled
      - -Dusbredir=enabled
      - -Dpolkit=disabled
      - -Dlz4=enabled
      - -Dusb-acl-helper-dir=/usr/libexec
      - -Dusb-ids-path=/usr/share/misc/usb.ids
      - -Dwebdav=enabled
      - -Dvapi=enabled
      - -Degl=enabled
    build-packages:
      - libcacard-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer1.0-dev
      - libjpeg-turbo8-dev # jconfig.h, the SDK only ships jpeglib.h
      - libopus-dev
      - libphodav-3.0-dev
      - libusb-1.0-0-dev
      - libusbredirhost-dev
      - libusbredirparser-dev
      - libva-dev
    stage-packages:
      # spice-gtk is built from source, so its runtime dependencies are not
      # pulled in by an archive spice package. gnome-core26 does not ship any
      # of these.
      - libcacard0
      - liblz4-1
      - libopus0
      - libphodav-3.0-0
      - libusb-1.0-0
      - libusbredirhost1t64
      - libusbredirparser1t64
      - libva-x11-2
      - libva-wayland2
      - usb.ids
    stage:
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libxml2.so.* # provided by runtime-libs
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  gnome-boxes:
    after:
      - libspice-gtk
      - libvirt-glib
      - libosinfo
    source: https://gitlab.gnome.org/GNOME/gnome-boxes.git
    source-tag: '50.0'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: 51.0
    parse-info: [usr/share/metainfo/org.gnome.Boxes.metainfo.xml]
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Ddistributor_name=Ubuntu
    organize:
      snap/gnome-boxes/current/usr: usr
    build-packages:
      - libarchive-dev
      - libgtk-vnc-2.0-dev
      - libusb-1.0-0-dev
      - cmake
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      sed -i.bak -e "s|symlink_media: true|symlink_media: false|g" $CRAFT_PART_SRC/help/meson.build
      # Ensure we save VMs in $SNAP_USER_COMMON
      git apply $CRAFT_PROJECT_DIR/patches/gnome-boxes-snap-user-common.patch
      # Update recommended downloads
      git apply $CRAFT_PROJECT_DIR/patches/gnome-boxes-recommended-downloads.patch
      git apply $CRAFT_PROJECT_DIR/patches/gnome-boxes-explain-usb-error.patch
      # Downloader hardcodes /var/tmp, which isn't writable in strict
      # confinement; use the user's Downloads directory instead when
      # available (resolved through glib, see the patch)
      git apply $CRAFT_PROJECT_DIR/patches/gnome-boxes-snap-tmp-dir.patch
    build-environment:
      - C_INCLUDE_PATH: ${C_INCLUDE_PATH:+$C_INCLUDE_PATH:}$CRAFT_STAGE/usr/include/libvirt-gconfig-1.0:$CRAFT_STAGE/usr/include/libvirt-glib-1.0:$CRAFT_STAGE/usr/include/libvirt-gobject-1.0
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  libraries:
    after: [ gnome-boxes ]
    plugin: nil
    stage-packages:
      - libcurl3t64-gnutls
      - libgtk-vnc-2.0-0
      - libgvnc-1.0-0
      - libldap2
      - libnghttp2-14
      - libnspr4
      - libnss3
      - librtmp1
      - libsasl2-2
      - libssh-4
      - pci.ids
    stage:
      - -usr/lib/*/libxml2.so.* # conflicts with qemu part
    prime:
      - usr/lib/*/libcaca*.so.*
      - usr/lib/*/libcurl*.so.*
      - usr/lib/*/libgss*.so.*
      - usr/lib/*/libgtk-vnc*.so.*
      - usr/lib/*/libgvnc*.so.*
      - usr/lib/*/libhcrypt*.so.*
      - usr/lib/*/libhei*.so.*
      - usr/lib/*/libhx*.so.*
      - usr/lib/*/libkrb*.so.*
      - usr/lib/*/liblber*.so.*
      - usr/lib/*/libldap*.so.*
      - usr/lib/*/libng*.so.*
      - usr/lib/*/libns*.so*
      - usr/lib/*/libnuma*.so.*
      - usr/lib/*/libopus*.so.*
      - usr/lib/*/libphodav*.so.*
      - usr/lib/*/libplc*.so*
      - usr/lib/*/libpld*.so*
      - usr/lib/*/libroken*.so.*
      - usr/lib/*/librtmp*.so.*
      - usr/lib/*/libsasl*.so.*
      - usr/lib/*/libspice*.so.*
      - usr/lib/*/libssh*.so.*
      - usr/lib/*/libusb*.so.*
      - usr/lib/*/libva*.so.*
      - usr/bin/osinfo*
      - usr/share/misc/pci.ids
      - usr/share/misc/usb.ids

  osinfo-db:
    source: https://gitlab.com/libosinfo/osinfo-db.git
    source-tag: v20260812
    source-depth: 1
    plugin: make
    build-packages:
      - gettext
      - osinfo-db-tools
      - wget
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/share/osinfo
      tar xf osinfo-db-*.tar.xz --strip-components=1 -C $CRAFT_PART_INSTALL/usr/share/osinfo
      VERSION=$(wget -qO- https://changelogs.ubuntu.com/meta-release-development | python3 -c '
      import sys

      def ver_tuple(v):
          return tuple(int(p) for p in v.split("."))

      best = None
      block = {}
      for line in sys.stdin:
          line = line.strip()
          if not line:
              if block.get("Supported") == "0":
                  v = ver_tuple(block.get("Version", "0"))
                  if best is None or v > best[0]:
                      best = (v, block.get("Dist"))
              block = {}
              continue
          if ":" in line:
              k, val = line.split(":", 1)
              block[k.strip()] = val.strip()
      if block.get("Supported") == "0":
          v = ver_tuple(block.get("Version", "0"))
          if best is None or v > best[0]:
              best = (v, block.get("Dist"))
      if best:
          print(best[1])
      ')
      sed "s/@VERSION@/$VERSION/g" $CRAFT_PROJECT_DIR/ubuntu-daily.xml \
        > $CRAFT_PART_INSTALL/usr/share/osinfo/os/ubuntu.com/ubuntu-daily.xml
    prime:
      - usr/share/osinfo

  runtime-libs:
    after: [ gnome-boxes, libspice-gtk, libosinfo ]
    plugin: nil
    stage-packages:
      # gnome-core26 has no libxml2 at all (the SDK ships the library and
      # the python binding, the platform ships neither). libvirt, libosinfo
      # and gnome-boxes link the 2.15 soname from the 26.04 archive.
      - libxml2-16
    override-build: |
      craftctl default
      # gnome/cleanup removes every primed library whose path also exists in
      # gnome-core26-sdk. The SDK carries libxml2 below usr/lib/<triplet>,
      # the platform does not ship it anywhere, so keep the staged copy at
      # usr/lib/libxml2.so.16 (which is on the runtime library path set by
      # the app environment) where the cleanup does not match it.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
      # The layout binds these paths; make sure the bind targets exist even
      # though the session libvirt instance writes below $HOME.
      mkdir -p "$CRAFT_PART_INSTALL/var/lib/libvirt" \
               "$CRAFT_PART_INSTALL/usr/lib/libvirt" \
               "$CRAFT_PART_INSTALL/usr/lib/ipxe"

  qemu:
    plugin: nil
    # The old recipe staged the third-party qemu-virgil snap, which only
    # exists for amd64 and was built for an old base. The 26.04 archive
    # provides QEMU 10.2.1 for amd64 and arm64, which is the version libvirt
    # 12.6 is developed and tested against, so stage it from the archive.
    stage-packages:
      - qemu-system-x86
      - qemu-system-arm
      # Ubuntu ships the SPICE and OpenGL (virgl) display backends as
      # separate modules. Boxes' guest display needs the SPICE one.
      - qemu-system-modules-spice
      - qemu-utils
      - seabios
      - ipxe-qemu
      - ovmf-generic
      # libvirt picks the UEFI firmware through the JSON descriptors in
      # /usr/share/qemu/firmware; the aarch64 ones come from this package.
      - qemu-efi-aarch64
      - dnsmasq-base
    # Ubuntu 26.04 makes every qemu binary depend on the ubuntu-virt
    # metapackage, which pulls in the ubuntu_virt apt helper and python3.
    # Neither is used at run time; prune them so the snap does not grow a
    # second python interpreter next to the one in gnome-core26.
    prime:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      - -usr/bin/ubuntu_virt_helper
      - -usr/bin/apt_hook_ubuntu_virt
      - -usr/bin/python3*
      - -usr/lib/python3*
      - -usr/share/python3*
      - -etc/apt

  launcher:
    plugin: dump
    after: [ qemu ]
    source: scripts
    organize:
      launcher.sh: bin/launcher
