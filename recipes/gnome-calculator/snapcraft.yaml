name: gnome-calculator
adopt-info: gnome-calculator
summary: GNOME Calculator
description: |
  GNOME Calculator is an application that solves mathematical equations.
  Though it at first appears to be a simple calculator with only basic
  arithmetic operations, you can switch into Advanced, Financial, or
  Programming mode to find a surprising set of capabilities.

  The Advanced calculator supports many operations, including:
  logarithms, factorials, trigonometric and hyperbolic functions,
  modulus division, complex numbers, random number generation, prime
  factorization and unit conversions.

  Financial mode supports several computations, including periodic interest
  rate, present and future value, double declining and straight line
  depreciation, and many others.

  Programming mode supports conversion between common bases (binary, octal,
  decimal, and hexadecimal), boolean algebra, one’s and two’s complementation,
  character to character code conversion, and more.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

slots:
  # for GtkApplication registration
  gnome-calculator:
    interface: dbus
    bus: session
    name: org.gnome.Calculator

apps:
  gnome-calculator:
    command: usr/bin/gnome-calculator
    extensions: [gnome]
    environment:
      # gnome-core26 doesn't ship libxml2, so the part below bundles it in
      # usr/lib. The gnome extension only puts the platform on the library
      # path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - gsettings
      - network
      - network-status
    desktop: usr/share/applications/org.gnome.Calculator.desktop
    common-id: org.gnome.Calculator.desktop

parts:
  gnome-calculator:
    source: https://gitlab.gnome.org/GNOME/gnome-calculator.git
    source-tag: '51.1'
    source-depth: 1
    plugin: meson
    parse-info: [usr/share/metainfo/org.gnome.Calculator.metainfo.xml]
    meson-parameters:
      - --prefix=/snap/gnome-calculator/current/usr
      - --buildtype=release
      - -Dvala_args="--vapidir=$CRAFT_STAGE/usr/share/vala/vapi"
      - -Ddisable-introspection=true
      - -Dgcalc=false
      - -Dgci=false
      # valadoc fails, but we don't need it in the snap anyway
      - -Ddoc=false
    organize:
      snap/gnome-calculator/current/usr: usr
    build-packages:
      - libmpc-dev
      - libmpfr-dev
      - libgvc7
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    override-build: |
      # Don't symlink media it leaves dangling symlinks in the snap
      sed -i.bak -e 's|media: gnome_calculator_help_media|media: gnome_calculator_help_media, symlink_media: false|g' $CRAFT_PART_SRC/help/meson.build
      # Use bundled icon rather than themed icon, needed for 18.04
      sed -i.bak -e 's|Icon=@app_id@$|Icon=${SNAP}/meta/gui/org.gnome.Calculator.svg|g' $CRAFT_PART_SRC/data/org.gnome.Calculator.desktop.in
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/apps/org.gnome.Calculator.svg $CRAFT_PART_INSTALL/meta/gui/
      craftctl default
    prime:
      # Don't include files needed to develop things against the gnome-calculator libraries
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/gir-1.0
      - -usr/share/vala
      # There currently isn't a way to use snaps in GNOME Shell search
      - -usr/libexec
      - -usr/share/gnome-shell/search-providers

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26 has no libxml2, but gnome-calculator links it directly
      # (currency conversion parses the ECB rates as XML).
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*

