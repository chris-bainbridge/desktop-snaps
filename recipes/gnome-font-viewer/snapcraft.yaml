name: gnome-font-viewer
adopt-info: gnome-font-viewer
summary: View fonts on your system
contact: https://gitlab.gnome.org/GNOME/gnome-font-viewer/-/issues
description: |
  GNOME Fonts shows you the fonts installed on your computer for your use as
  thumbnails.
  Selecting any thumbnails shows the full view of how the font would look under
  various sizes.

  GNOME Fonts also supports installing new font files downloaded in the .ttf
  and other formats.
  Fonts may be installed only for your use or made available to all users on the computer.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  gnome-font-viewer:
    interface: dbus
    bus: session
    name: org.gnome.font-viewer

apps:
  gnome-font-viewer:
    extensions: [gnome]
    command: usr/bin/gnome-font-viewer
    desktop: usr/share/applications/org.gnome.font-viewer.desktop
    common-id: org.gnome.font-viewer.desktop
    plugs:
      - home

# GNOME Fonts is a GTK4 + libadwaita application (meson build). GTK 4,
# libadwaita, harfbuzz, fontconfig, freetype and fribidi all come from the
# gnome-core26 SDK/content snaps, so no extra libraries are bundled.
#
# The prefix is the runtime mount path, not /usr: GNOMELOCALEDIR is compiled
# into the binary, and a /usr prefix would resolve the translations to the
# core26 base instead of the snap. organize moves the installed tree back
# under usr/.
parts:
  gnome-font-viewer:
    source: https://gitlab.gnome.org/GNOME/gnome-font-viewer.git
    source-type: git
    source-tag: '50.0'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: '51'
#     no-9x-revisions: true
    parse-info: [usr/share/metainfo/org.gnome.font-viewer.metainfo.xml]
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    plugin: meson
    meson-parameters:
      - --prefix=/snap/gnome-font-viewer/current/usr
      - --buildtype=release
    organize:
      snap/gnome-font-viewer/current/usr: usr
    build-packages:
      - xkb-data
    override-build: |
      # gtk-common-themes does not carry the application icon, so ship the
      # upstream icon in meta/gui and point the desktop file at it.
      sed -i.bak -e 's|^Icon=@APPLICATION_ID@$|Icon=${SNAP}/meta/gui/org.gnome.font-viewer.svg|g' \
        "$CRAFT_PART_SRC/data/org.gnome.font-viewer.desktop.in.in"
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_SRC/data/icons/hicolor/scalable/apps/org.gnome.font-viewer.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/"
      # D-Bus activation is provided by the dbus slot above (snapd writes a
      # service file that runs "snap run"). Upstream's service file has a
      # build-time absolute Exec that the host bus would not use.
      rm -f "$CRAFT_PART_INSTALL/snap/gnome-font-viewer/current/usr/share/dbus-1/services/org.gnome.font-viewer.service"
