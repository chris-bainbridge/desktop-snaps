name: loupe
base: core26
adopt-info: loupe
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

parts:
  loupe:
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/loupe.git
    source-tag: '51.2'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     lower-than: '52.0'
    build-packages:
      # Rust 1.93 from 26.04 satisfies the 1.93 MSRV (edition 2024).
      # cargo/rustc are not part of gnome-core26-sdk.
      - cargo
      - rustc
      # libseccomp is a hard dependency of the glycin Rust crate
      - libseccomp-dev
    meson-parameters:
      # The prefix is the runtime mount path, not /usr: LOCALEDIR is compiled
      # into the binary and a /usr prefix would resolve it to the core26 base.
      # organize moves the installed tree back under usr/.
      - --prefix=/snap/loupe/current/usr
      - --buildtype=release
    organize:
      snap/loupe/current/usr: usr
    parse-info: [ usr/share/metainfo/org.gnome.Loupe.metainfo.xml ]

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26 has no libxml2, but libgweather (linked by loupe)
      # needs it.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*

slots:
  loupe:
    interface: dbus
    bus: session
    name: org.gnome.Loupe

apps:
  loupe:
    command: usr/bin/loupe
    desktop: usr/share/applications/org.gnome.Loupe.desktop
    extensions: [ gnome ]
    common-id: org.gnome.Loupe
    environment:
      # gnome-core26 doesn't ship libxml2, so the libraries part bundles it
      # in usr/lib. The gnome extension only puts the platform on the
      # library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - gsettings
      # Required for Next/Previous Image to work
      - home
      - removable-media
