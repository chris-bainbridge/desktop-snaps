name: quadrapassel
adopt-info: quadrapassel
summary: Fit falling blocks together
description: |
  Quadrapassel is a derivative of a classic Russian falling-block game.
  Reposition and rotate the blocks as they fall, and attempt to fit them
  together. When you form a complete horizontal row of blocks, the row will
  disappear and you score points. The game is over when the blocks get stacked
  too high. As your score gets higher, you level up and the blocks fall faster.

  If you’re looking for a challenge, Quadrapassel allows you to increase the
  initial speed of the blocks, or begin the game with partial blocks on some of
  the rows. Or, instead of allowing the blocks to fall randomly, it can select
  blocks that will be hard for you to place.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26
license: GPL-3.0+

platforms:
  amd64:
  arm64:

layout:
  # The game loads its sound files from the absolute path it was built with.
  /usr/share/sounds/quadrapassel:
    bind: $SNAP/usr/share/sounds/quadrapassel

slots:
  # for GtkApplication registration
  quadrapassel:
    interface: dbus
    bus: session
    name: org.gnome.Quadrapassel

apps:
  quadrapassel:
    command: usr/bin/quadrapassel
    extensions: [gnome]
    plugs:
      - gsettings
      - audio-playback
    desktop: usr/share/applications/org.gnome.Quadrapassel.desktop
    common-id: org.gnome.Quadrapassel.desktop

parts:
  quadrapassel:
    source: https://gitlab.gnome.org/GNOME/quadrapassel.git
    source-type: git
    source-tag: '51.1'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    parse-info: [usr/share/metainfo/org.gnome.Quadrapassel.metainfo.xml]
    build-packages:
      # manette and the libgnome-games-support sound backend are not part of
      # the gnome-core26 SDK
      - libmanette-0.2-dev
      - libsndfile1-dev
      - libopenal-dev
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # Use the bundled icon rather than relying on the host icon theme
      sed -i.bak -e 's|^Icon=@app-id@$|Icon=${SNAP}/meta/gui/org.gnome.Quadrapassel.svg|g' data/org.gnome.Quadrapassel.desktop.in.in
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/scalable/org.gnome.Quadrapassel.svg $CRAFT_PART_INSTALL/meta/gui/

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26 has libsndfile, but neither libmanette (gamepads) nor
      # OpenAL (sound output through libgnome-games-support)
      - libmanette-0.2-0
      - libhidapi-hidraw0
      - libopenal1
    prime:
      - usr/lib/*/libmanette*
      - usr/lib/*/libhidapi*
      - usr/lib/*/libopenal*
