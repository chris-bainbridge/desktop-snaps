# A strictly confined snap has no /dev/snd and cannot open ALSA hardware
# devices. The audio-playback interface instead exposes the desktop's
# PulseAudio/PipeWire sound server, and Ruffle plays through cpal, whose only
# Linux backend is ALSA. Point ALSA's default PCM and control device at
# libasound's PulseAudio plugin, which is staged in usr/lib/ruffle/alsa-lib
# and selected with ALSA_PLUGIN_DIR in the launcher.
#
# This file replaces alsa-lib's global configuration (ALSA_CONFIG_PATH), so
# it only defines what Ruffle needs. Hardware PCMs would not be reachable
# anyway; the "default" device is what cpal opens.
pcm.!default {
    type pulse
    hint {
        show on
        description "Default ALSA Output (PulseAudio/PipeWire)"
    }
}

ctl.!default {
    type pulse
}
