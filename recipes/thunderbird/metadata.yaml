# Build metadata for thunderbird (core26 migration, 2026-11).
#
# Flat-layout exception: this recipe is the core26 packaging from the
# upstream 'beta' branch, but it builds the current stable release. The
# upstream 'stable' branch is still core24, and the store's latest/stable
# channel still ships core24.
snap: thunderbird
base: core26
mode: vendored
redistribution: open-source
upstream:
  provider: github
  project: thunderbird/thunderbird-desktop
recipe: https://github.com/ubuntu/thunderbird (beta)
recipe-commit: d025ed45e7688ac5398582162bbf095e16cfe9cd
merge-request: https://github.com/ubuntu/thunderbird/pull/70
store:
  publisher: Canonical
  verified: true
