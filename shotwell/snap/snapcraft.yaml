name: shotwell
adopt-info: shotwell
grade: stable
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  shotwell:
    interface: dbus
    bus: session
    name: org.gnome.Shotwell

layout:
  # Shotwell looks its helper binaries (video thumbnailer, settings migrator)
  # up through their absolute build-time path. Only bind the shotwell
  # subdirectory: the gnome extension already binds /usr/libexec/glycin-loaders.
  /usr/libexec/shotwell:
    bind: $SNAP/usr/libexec/shotwell
  # Same for the builtin plugin directory (publishing and transitions): it is
  # resolved as $prefix/lib/$triplet/shotwell/plugins, an absolute path.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/shotwell:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/shotwell

apps:
  shotwell:
    command: usr/bin/shotwell
    extensions: [gnome]
    desktop: usr/share/applications/org.gnome.Shotwell.desktop
    common-id: org.gnome.Shotwell.desktop
    environment:
      HOME: $SNAP_USER_COMMON
    plugs: &pluglist
      - audio-playback
      - home
      - raw-usb
      - mount-observe
      - hardware-observe
      - removable-media
  shotwell-viewer:
    command: usr/bin/shotwell
    extensions: [gnome]
    desktop: usr/share/applications/org.gnome.Shotwell-Viewer.desktop
    common-id: org.gnome.Shotwell-Viewer.desktop
    environment:
      HOME: $SNAP_USER_COMMON
    plugs: *pluglist

parts:
  # Shotwell 33.x requires gexiv2 0.16 (pkg-config name gexiv2-0.16), but the
  # 26.04 archive still ships gexiv2 0.14.6, so build the released 0.16.2
  # from source and link shotwell against it.
  gexiv2:
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/gexiv2.git
    source-type: git
    source-tag: '0.16.2'
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dtests=false
      - -Dtools=false
      - -Dpython3=false
      - -Dgtk_doc=false
    build-packages:
      - libexiv2-dev
    stage-packages:
      - libexiv2-28
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/gir-1.0
      - -usr/share/vala
      - -usr/share/doc
      - -usr/share/man

  shotwell:
# ext:updatesnap
#   version-format:
#     format: "%M.%m"
    after: [gexiv2]
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/shotwell.git
    source-type: git
    source-tag: '33.2'
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dinstall_apport_hook=false
    build-environment:
      # The gexiv2 built in the part above is not installed in the build
      # environment, so point valac at its vapi and the linker at the staged
      # copy (craft-parts already adds the -L/-isystem flags).
      - VALAFLAGS: --vapidir=$CRAFT_STAGE/usr/share/vala/vapi
    parse-info: [usr/share/metainfo/org.gnome.Shotwell.metainfo.xml]
    build-packages:
      # The gnome-core26-sdk provides GTK4, GLib/GIO, GStreamer, libsoup-3.0,
      # libsecret, libgee, gudev, libportal and libxml2 development files.
      # It does not ship gexiv2 (built above), libexif, libgphoto2, libraw,
      # gcr-4 (the SDK still has gcr-3) or yelp-build.
      - libexif-dev
      - libgphoto2-dev
      - libraw-dev
      - libgcr-4-dev
      - yelp-tools
    stage-packages:
      - libexif12
      - libgphoto2-6t64
      - libgphoto2-port12t64
      - libraw23t64
      - libgcr-4-4
    override-build: |
      # gnome.yelp's media symlinks would dangle in the snap.
      sed -i.bak -e 's|symlink_media: true|symlink_media: false|' \
        $CRAFT_PART_SRC/help/meson.build
      craftctl default
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/gir-1.0
      - -usr/share/vala
      - -usr/share/gtk-doc
      - -usr/share/doc
      - -usr/share/man
      - -usr/lib/*/*.la
      # shotwell links the plain libraw, not the reentrant libraw_r
      - -usr/lib/*/libraw_r.so*
      # libpsl is only dragged in as a dependency of libcurl, which
      # gnome-core26 already provides and nothing in the snap links.
      - -usr/lib/*/libpsl.so*

  libraries:
    after: [shotwell]
    plugin: nil
    stage-packages:
      # gnome-core26 has no libxml2, but shotwell, libgphoto2 and gexiv2 link
      # it directly.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the
      # extension's LD_LIBRARY_PATH includes $SNAP/usr/lib.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
        "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*
