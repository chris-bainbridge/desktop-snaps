name: swell-foop
adopt-info: swell-foop
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration
  swell-foop:
    interface: dbus
    bus: session
    name: org.gnome.SwellFoop

apps:
  swell-foop:
    command: usr/bin/swell-foop
    extensions: [gnome]
    plugs:
      # the gnome extension no longer adds it on core26
      - gsettings
    environment:
      # gnome-core26's librsvg links libxml2.so.16, which the content snap
      # does not ship, so the libraries part below bundles it in usr/lib.
      # The gnome extension only puts the platform on the library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    desktop: usr/share/applications/org.gnome.SwellFoop.desktop
    common-id: org.gnome.SwellFoop.desktop

# Swell Foop 50.0 is the GTK4 + libadwaita Vala application; GTK 4,
# libadwaita and valac come from the gnome-core26 SDK/content snaps.
#
# The prefix is the runtime mount path, not /usr: LOCALEDIR is compiled into
# the binary and the bundled libgnome-games-support, and a /usr prefix would
# make gettext look in the core26 base instead of the snap. organize moves
# the installed tree back under usr/.
parts:
  swell-foop:
    source: https://gitlab.gnome.org/GNOME/swell-foop.git
    source-type: git
    source-tag: '50.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/snap/swell-foop/current/usr
      - --buildtype=release
    organize:
      snap/swell-foop/current/usr: usr
    build-packages:
      # meson fetches libgnome-games-support through its git wrap
      - git
      # gnome.yelp is not shipped by gnome-core26-sdk
      - itstool
      - yelp-tools
    parse-info: [usr/share/metainfo/org.gnome.SwellFoop.metainfo.xml]
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # Symlinked help media ends up dangling inside the snap
      sed -i.bak -e 's|symlink_media: true|symlink_media: false|g' $CRAFT_PART_SRC/help/meson.build
    override-build: |
      sed -i.bak -e 's|Icon=org.gnome.SwellFoop$|Icon=${SNAP}/meta/gui/org.gnome.SwellFoop.png|g' $CRAFT_PART_SRC/data/org.gnome.SwellFoop.desktop.in
      craftctl default
      # meson's gnome.post_install() is skipped when DESTDIR is set, which is
      # how snapcraft installs. Compile the schema here so GSettings can
      # resolve org.gnome.SwellFoop on first run.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/snap/swell-foop/current/usr/share/glib-2.0/schemas"
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp $CRAFT_PART_SRC/data/icons/hicolor/512x512/apps/org.gnome.SwellFoop.png $CRAFT_PART_INSTALL/meta/gui/

  libraries:
    plugin: nil
    stage-packages:
      # gnome-core26's librsvg links libxml2.so.16, but the content snap does
      # not ship libxml2. swell-foop renders its themes through it.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome/cleanup part deletes every primed library whose path also
      # exists in the gnome-core26 SDK. libxml2 is in the SDK but not in the
      # content snap, so move it out of the SDK's multiarch path; $SNAP/usr/lib
      # is on the default LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*
