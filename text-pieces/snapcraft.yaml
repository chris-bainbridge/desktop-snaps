name: text-pieces
adopt-info: text-pieces
title: Text Pieces
summary: Developer's scratchpad
contact: https://gitlab.com/liferooter/textpieces/-/issues
description: |
  Text Pieces is a powerful scratchpad with a large set of text
  transformations: calculate hashes, encode and decode text, count lines,
  words and characters, format JSON and XML, escape and unescape strings,
  convert between JSON and YAML or TOML, filter and sort lines, and more.

  It is extendable with your own script-based actions.

  Strict-confinement notes:
   * Files in the home directory are accessible; other locations are only
     reachable through the file chooser (XDG document portal).
   * Custom action scripts run inside the snap, so only interpreters and
     tools shipped in the base and the snap (sh, bash, awk, ...) are
     available. Host-only interpreters such as python3, perl or node are
     not visible. The built-in actions do not need them.
   * The application is offline-only and gets no network plug.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core26
license: GPL-3.0-or-later

platforms:
  amd64:
  arm64:

slots:
  # for GtkApplication registration and D-Bus activation
  # (data/io.gitlab.liferooter.TextPieces.service.in)
  text-pieces:
    interface: dbus
    bus: session
    name: io.gitlab.liferooter.TextPieces

apps:
  text-pieces:
    extensions: [gnome]
    command: usr/bin/textpieces
    desktop: usr/share/applications/io.gitlab.liferooter.TextPieces.desktop
    common-id: io.gitlab.liferooter.TextPieces.desktop
    environment:
      # gnome-core26's libgtksourceview-5 links libxml2, which the content
      # snap does not ship. The libraries part below bundles it in usr/lib.
      # The gnome extension only puts the platform on the library path.
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      # the snap's io.gitlab.liferooter.TextPieces GSettings schema
      - gsettings
      # open and save files
      - home

# Text Pieces 4.3.2 is a Rust + GTK4/libadwaita application (GtkSourceView 5
# editor) whose Meson build drives cargo itself on the upstream Cargo.lock.
# One dependency, textpieces-core, is a git dependency pinned to tag v2.0.1
# on gitlab.com; cargo fetches it, plus the crates.io crates, during the
# build.
#
# GTK 4.24, libadwaita, GtkSourceView 5, gettext and pkg-config come from the
# gnome-core26 SDK/content snaps. cargo and rustc are not part of the
# platform; the 26.04 archive has 1.93.1, which satisfies the crate's MSRV.
# blueprint-compiler is also from the archive.
#
# The prefix is the runtime mount path, not /usr: the binary has PKGDATADIR
# (resources.gresource and action_template), LOCALEDIR and the D-Bus service
# Exec line compiled in, and a /usr prefix would resolve them to the core26
# base instead of the snap. organize moves the installed tree back under usr/.
parts:
  text-pieces:
    source: https://gitlab.com/liferooter/textpieces.git
    source-type: git
    source-tag: '4.3.2'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/snap/text-pieces/current/usr
      - --buildtype=release
    organize:
      snap/text-pieces/current/usr: usr
    build-packages:
      - blueprint-compiler
      - cargo
      - rustc
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
      # use the icon bundled in the snap so it shows up in the launcher
      sed -i.bak -e 's|^Icon=@icon@$|Icon=${SNAP}/meta/gui/io.gitlab.liferooter.TextPieces.svg|g' \
        data/io.gitlab.liferooter.TextPieces.desktop.in.in
    override-build: |
      craftctl default
      # meson skips gnome.post_install() when DESTDIR is set, so the GSettings
      # schema is never compiled. Text Pieces creates its Gio.Settings object
      # at start-up; make sure gschemas.compiled is present in the snap.
      glib-compile-schemas \
        "$CRAFT_PART_INSTALL/snap/text-pieces/current/usr/share/glib-2.0/schemas"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      cp "$CRAFT_PART_INSTALL/snap/text-pieces/current/usr/share/icons/hicolor/scalable/apps/io.gitlab.liferooter.TextPieces.svg" \
        "$CRAFT_PART_INSTALL/meta/gui/"

  libraries:
    after: [text-pieces]
    plugin: nil
    stage-packages:
      # gnome-core26 has no libxml2, but libgtksourceview-5 links it directly
      # and Text Pieces uses GtkSourceView for its editor.
      - libxml2-16
    override-build: |
      craftctl default
      # The gnome extension's cleanup part deletes every primed library whose
      # path also exists in gnome-core26-sdk. libxml2 is in the SDK but not in
      # the content snap, so move it out of the SDK's multiarch path; the app
      # puts $SNAP/usr/lib on LD_LIBRARY_PATH.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib"
      mv "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"/libxml2.so.16* \
         "$CRAFT_PART_INSTALL/usr/lib/"
    prime:
      - usr/lib/libxml2.so.*
